  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -10%, rgba(47,111,237,0.4), transparent 55%),
      radial-gradient(circle at 100% 110%, rgba(230,57,70,0.18), transparent 50%),
      var(--bg-photo) center top / cover no-repeat fixed,
      var(--navy-deep);
    color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .display{
    font-family:'Teko', sans-serif;
    font-weight:600;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    padding:18px 16px 60px;
    min-height:100vh;
  }
  .scoreboard{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.02);
    padding:18px 20px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .scoreboard::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .sb-top{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px; margin-bottom:12px;
  }
  .sb-top .brand-group{ display:flex; align-items:center; gap:9px; }
  .sb-top .brand{ font-size:24px; color:var(--white); letter-spacing:0.05em;}
  .sb-top .meta{ font-size:14px; color:var(--chalk); opacity:0.7; font-family:'Work Sans'; text-transform:none;}
  .logo-badge{ flex-shrink:0; line-height:0; }
  .logo-badge svg{ display:block; }
  .player-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .player-name{ font-size:32px; line-height:1; color:var(--chalk);}
  .player-sub{ font-size:14px; color:var(--blue-soft); font-family:'Work Sans'; text-transform:none; font-weight:600; letter-spacing:0;}
  .player-sub.trait-tag{ color:var(--stat-mid); font-size:12.5px; margin-top:2px; cursor:help; }
  .badge{
    display:inline-block; padding:4px 12px; border-radius:999px;
    font-family:'Work Sans'; font-size:12px; font-weight:600; text-transform:none;
    background:rgba(230,57,70,0.18); color:#FF8A93; border:1px solid rgba(230,57,70,0.45);
    margin-right:6px;
  }
  .stat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px;}
  .stat-legend{ font-size:10.5px; color:rgba(244,247,251,0.55); margin-top:8px; line-height:1.5; }
  .stat{ text-align:center; }
  .stat .val{ font-family:'Teko'; font-size:28px; color:var(--chalk); line-height:1;}
  .stat .bar{ height:6px; border-radius:999px; background:rgba(255,255,255,0.12); margin:5px 0 4px; overflow:hidden;}
  .stat .bar > div{ height:100%; background:var(--stat-color, var(--blue)); border-radius:999px; }
  .stat .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:0.03em; opacity:0.7; white-space:nowrap; }
  .vitals{ display:flex; gap:14px; margin-top:12px; font-size:13px; flex-wrap:wrap;}
  .vitals-legend{ font-size:10.5px; color:rgba(244,247,251,0.55); margin-top:4px; line-height:1.5; }
  .vitals span b{ color:var(--blue-soft); font-weight:600; }

  .card{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{ font-size:24px; color:var(--chalk); margin-bottom:6px; }
  .card p.desc{ font-family:'Work Sans'; font-size:15px; line-height:1.5; opacity:0.85; margin:0 0 14px;}

  .choice-list{ display:flex; flex-direction:column; gap:10px; }
  button.choice{
    text-align:left;
    background: rgba(47,111,237,0.14);
    border:1px solid rgba(47,111,237,0.5);
    color:var(--chalk);
    padding:14px 16px;
    border-radius:16px;
    font-family:'Work Sans';
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  button.choice:hover{ background:rgba(47,111,237,0.26); border-color:var(--blue-soft); transform:translateY(-1px); }
  button.choice .sub{ display:block; font-weight:400; font-size:13px; opacity:0.75; margin-top:3px;}
  button.choice:active{ transform:translateY(0px) scale(0.99); }

  .country-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:480px){ .country-grid{grid-template-columns:1fr;} }

  .progression-chart{ width:100%; height:90px; display:block; }
  .progression-area{ fill:rgba(47,111,237,0.18); stroke:none; }
  .progression-line{ fill:none; stroke:var(--blue-soft); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .progression-dot{ fill:var(--red); }

  .action-layout{ display:flex; flex-direction:column; }
  @media (min-width:900px){
    #app{ max-width:960px; }
    .action-layout{ display:grid; grid-template-columns: 380px 1fr; align-items:start; gap:18px; }
    .action-layout .scoreboard{ margin-bottom:0; position:sticky; top:18px; }
  }
  .country-card{
    border:1px solid var(--line); border-radius:18px; padding:16px;
    background:rgba(255,255,255,0.04); cursor:pointer; transition:.12s;
  }
  .country-card:hover{ border-color:var(--red); background:rgba(230,57,70,0.08); }
  .country-card.selected{ border-color:var(--red); background:rgba(230,57,70,0.14); }
  .country-card h3{ font-size:22px; color:var(--chalk); }
  .country-card p{ font-family:'Work Sans'; font-size:12.5px; opacity:0.75; margin:4px 0 0; line-height:1.4;}
  .country-flag{ font-size:30px; line-height:1; margin-bottom:4px; }
  .lang-switch{ display:flex; justify-content:center; gap:8px; margin-bottom:6px; }
  .progress-link{ display:block; width:100%; margin-top:10px; background:rgba(47,111,237,0.16); border:1.5px solid var(--blue); color:var(--chalk); border-radius:12px; padding:10px; font-size:14px; font-family:'Work Sans'; font-weight:700; cursor:pointer; }
  .progress-link:hover{ background:rgba(47,111,237,0.28); }
  .progress-link:hover{ border-color:var(--blue); }
  .lang-btn{ background:rgba(255,255,255,0.06); border:1px solid var(--line); color:var(--chalk); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Work Sans'; }
  .lang-btn.selected{ background:var(--blue); border-color:var(--blue); color:var(--white); }

  .pos-card-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  @media (max-width:600px){ .pos-card-grid{ grid-template-columns:1fr; } }
  .pos-card{
    padding:12px 14px; border-radius:16px; border:1px solid var(--line);
    background:rgba(255,255,255,0.04); cursor:pointer; font-family:'Work Sans'; text-align:left;
  }
  .pos-card .pos-card-title{ font-weight:700; font-size:14.5px; color:var(--chalk); }
  .pos-card .pos-card-desc{ font-size:12px; opacity:0.75; line-height:1.4; margin-top:3px; }
  .pos-card.selected{ border-color:var(--red); background:rgba(230,57,70,0.14); }

  .primary-btn{
    background:linear-gradient(90deg, var(--red), var(--red-deep)); color:var(--white); border:none; border-radius:16px;
    padding:14px 18px; font-family:'Work Sans'; font-weight:700; font-size:15px; cursor:pointer; width:100%;
    letter-spacing:0.01em;
  }
  .primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn:hover:not(:disabled){ filter:brightness(1.1); }
  .ghost-btn{
    background:transparent; color:var(--chalk); border:1px solid var(--line); border-radius:16px;
    padding:12px 16px; font-family:'Work Sans'; font-weight:600; font-size:14px; cursor:pointer; width:100%;
  }

  .log-feed{ display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto; padding-right:4px;}

<body>
<div id="splash-screen"></div>
<div id="app"></div>
<script>

// ============================================================
// HOME RUN LEGACY — moteur de simulation de carrière de baseball
// ============================================================

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function rndFloat() { return Math.random() * 0.999999 + 0.000001; }
function pick(arr) { return arr[rnd(0, arr.length - 1)]; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ---------- Noms aléatoires par pays ----------

const NAME_POOLS = {
  usa: {
    first: ["Jake","Mike","Chris","Tyler","Brandon","Dylan","Marcus","Cody","Trevor","Austin","DeShawn","Jordan","Logan","Cole","Jaylen","Ryan","Antoine","Blake","Xavier","Garrett"],
    last: ["Johnson","Miller","Davis","Rodriguez","Martinez","Anderson","Thompson","Harris","Clark","Lewis","Walker","Young","King","Wright","Scott","Torres","Bell","Murphy","Reed","Foster"],
  },
  japan: {
    first: ["Haruto","Ren","Sota","Yuto","Riku","Kaito","Daiki","Shota","Kenta","Takumi","Yuki","Hiroshi","Ryota","Naoki","Tsubasa","Shohei","Kazuki","Masato","Kohei","Taiga"],
    last: ["Sato","Suzuki","Takahashi","Tanaka","Watanabe","Ito","Yamamoto","Nakamura","Kobayashi","Saito","Kato","Yoshida","Yamada","Sasaki","Matsumoto","Inoue","Kimura","Hayashi","Shimizu","Yamaguchi"],
  },
  kr: {
    first: ["Min-jun","Seo-jun","Do-yoon","Ji-ho","Joon-woo","Hyun-woo","Tae-yang","Jun-seo","Woo-jin","Seung-min","Dong-hyun","Kyung-ho","Jae-won","Sung-min","Yong-jin","Chan-ho","Hyun-jin","Ji-sung","Min-ho","Sang-woo"],
    last: ["Kim","Lee","Park","Choi","Jung","Kang","Cho","Yoon","Jang","Lim","Han","Oh","Seo","Shin","Kwon","Hwang","Ahn","Song","Yoo","Hong"],
  },
  mx: {
    first: ["Carlos","Miguel","Luis","José","Alejandro","Fernando","Rodrigo","Diego","Emiliano","Santiago","Iván","Jesús","Ricardo","Manuel","Eduardo","Gerardo","Adrián","Julio","Sergio","Marco"],
    last: ["García","Hernández","Martínez","López","González","Pérez","Sánchez","Ramírez","Torres","Flores","Rivera","Gómez","Díaz","Reyes","Cruz","Morales","Ortiz","Delgado","Castro","Vargas"],
  },
  do: {
    first: ["Rafael","Juan","Pedro","Julio","Elías","José","Fernando","Miguel","Ramón","Ángel","Ronald","Cristian","Yoel","Franklin","Gerardo","Leonel","Máximo","Domingo","Bienvenido","Wilkin"],
    last: ["Peña","Rosario","Familia","Núñez","Polanco","Marte","Santana","Abreu","Castillo","Mercedes","Tejada","Severino","De León","Batista","Cabrera","Vargas","Reyes","Jiménez","Ortiz","Almonte"],
  },
  cu: {
    first: ["Yoel","Alexei","Osvaldo","Norge","Yunieski","Frederich","Raysel","Leonys","Yadiel","Ariel","Lázaro","Yordanis","Michel","Rogelio","Alfredo","Reinier","Vicyohandri","Yosvani","Danel","Guillermo"],
    last: ["Despaigne","Cepeda","Suárez","Enríquez","Kindelán","Linares","Bell","Urrutia","Abreu","Ferrer","Robaina","Guerra","Solís","Palacio","Ramos","Machado","Espinosa","Fonseca","Rondón","Alonso"],
  },
  tw: {
    first: ["Wei-Chieh","Chia-Hao","Chun-Wei","Yu-Cheng","Ming-Chieh","Chih-Wei","Po-Wei","Kai-Wei","Cheng-Yu","Yi-Chen","Chun-Hsien","Wen-Hao","Chia-Yu","Sheng-Wei","Zhi-Wei","Han-Yu","Wei-Lun","Chun-Yi","Yu-Chieh","Ting-Wei"],
    last: ["Chen","Lin","Wang","Chang","Li","Huang","Wu","Liu","Cai","Yang","Hsu","Chu","Kao","Lai","Su","Yeh","Tsai","Kuo","Hung","Fan"],
  },
};

function randomName(countryKey) {
  const pool = NAME_POOLS[countryKey] || NAME_POOLS.usa;
  return `${pick(pool.first)} ${pick(pool.last)}`;
}

// ---------- Points de carrière ----------
// Chaque choix (draft/transfert d'entrée + tous les événements de saison) fait varier
// les stats/moral/santé/réputation du joueur ; la somme nette de ces variations sur
// toute la carrière, plus des bonus de trophées, forme le score de points de carrière.

const TROPHY_POINTS = { mvp: 40, allstar: 15, rookie: 20, championship: 60, statTitle: 18 };
const POINTS_FIELDS = ["contact", "power", "speed", "defense", "control", "morale", "health", "reputation"];

function pointsSnapshot(player) {
  return {
    contact: player.stats.contact, power: player.stats.power, speed: player.stats.speed,
    defense: player.stats.defense, control: player.stats.control,
    morale: player.morale, health: player.health, reputation: player.reputation,
  };
}

function sumPointsDiff(before, after) {
  let total = 0;
  for (const k of POINTS_FIELDS) total += (after[k] - before[k]);
  return total;
}

// ---------- Contrat & salaire ----------
// Ordres de grandeur inspirés des minimums réels de chaque ligue (SSL, SDL, MCBL, LAB),
// simplifiés pour rester lisibles dans une simulation narrative.

function formatMoney(n) {
  return Math.round(n).toLocaleString("fr-FR");
}

function initialSalary(countryKey, quality) {
  const q = clamp(quality, 0, 1);
  switch (countryKey) {
    case "usa": return 700000 + q * 150000; // proche du minimum SSL
    case "japan": return 15000000 + q * 20000000; // ¥15-35M selon le rang de draft
    case "kr": return 30000000 + q * 40000000; // ₩30-70M selon le rang de draft
    case "mx": return 400000 + q * 500000; // MX$/an, échelle bien plus modeste
    case "do": return 350000 + q * 450000; // RD$/an, echelle similaire au Mexique
    case "cu": return 15000 + q * 20000; // $/an, echelle tres modeste (systeme provincial)
    case "tw": return 900000 + q * 1200000; // NT$/an
    default: return 500000;
  }
}

function renewContract(player) {
  const c = COUNTRIES[player.country];
  const perf = clamp(overall(player) + (player.reputation - 50) / 4, 1, 99);
  const raiseFactor = 1 + clamp((perf - 45) / 100, -0.15, 0.6) + (player.trophies.length > 0 ? 0.1 : 0);
  player.salary = Math.max(initialSalary(player.country, 0.2), Math.round((player.salary || initialSalary(player.country, 0.3)) * raiseFactor));
  player.contractYearsLeft = rnd(2, 4);
  log(player, `Nouveau contrat signé avec les ${player.team} : ${c.currency}${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
}

// ---------- Classement de ligue simulé ----------
// Un mini-classement fictif (5-6 équipes) généré chaque saison au sommet : les autres
// équipes évoluent aléatoirement, la tienne est légèrement influencée par ta performance.

// Force de fond d'une équipe, mémorisée d'une saison à l'autre plutôt que retirée
// indépendamment à chaque fois : une équipe forte le reste globalement, avec une
// dérive lente (progression ou déclin progressif) plutôt qu'un effondrement sans raison.
function getTeamStrength(player, team) {
  if (!player.teamStrengths) player.teamStrengths = {};
  if (player.teamStrengths[team] === undefined) {
    player.teamStrengths[team] = rnd(35, 65);
  } else {
    player.teamStrengths[team] = clamp(player.teamStrengths[team] + rnd(-6, 6), 20, 95);
  }
  return player.teamStrengths[team];
}

function generateStandings(player, perf) {
  const c = COUNTRIES[player.country];
  const otherTeams = c.teams.filter((t) => t !== player.team);
  const pool = [...otherTeams];
  const sample = [];
  const sampleSize = Math.min(9, pool.length);
  for (let i = 0; i < sampleSize; i++) {
    const idx = rnd(0, pool.length - 1);
    sample.push(pool.splice(idx, 1)[0]);
  }
  const ownWins = clamp(Math.round(50 + (perf - 50) * 0.8 + rnd(-6, 6)), 20, 100);
  const table = [
    { team: player.team, wins: ownWins },
    ...sample.map((t) => ({ team: t, wins: clamp(Math.round(getTeamStrength(player, t) + rnd(-10, 10)), 15, 100) })),
  ];
  table.sort((a, b) => b.wins - a.wins);
  return table;
}

// ---------- Statistiques de saison (AVG, HR, RBI / V-D, MPM, K) ----------
// Générées à partir des stats abstraites du joueur et de sa performance de la saison,
// pour donner un visage chiffré et réaliste à chaque campagne.

function generateStatLine(player, perf) {
  const s = player.stats;
  const noise = () => (Math.random() - 0.5) * 0.14; // légère variance d'une saison à l'autre
  if (player.isPitcher) {
    const decisions = 22 + Math.round(perf / 8);
    const winRate = clamp(0.30 + (s.control / 99) * 0.35 + (perf - 50) / 220 + noise(), 0.15, 0.85);
    const wins = clamp(Math.round(decisions * winRate), 1, 24);
    const losses = clamp(decisions - wins, 1, 20);
    const era = clamp(5.60 - (s.control / 99) * 3.6 - (perf - 50) / 55 + noise(), 1.35, 6.80);
    const k = clamp(Math.round(70 + (s.control / 99) * 130 + (perf - 50) * 2.1 + noise() * 60), 40, 310);
    return { type: "pitcher", wins, losses, era: Math.round(era * 100) / 100, k };
  }
  const avg = clamp(0.190 + (s.contact / 99) * 0.150 + (perf - 50) / 900 + noise() * 0.08, 0.150, 0.385);
  const hr = clamp(Math.round((s.power / 99) * 42 * (0.5 + perf / 140) + noise() * 10), 0, 62);
  const rbi = clamp(Math.round(hr * 2.1 + (s.contact / 99) * 45 + noise() * 15), 0, 145);
  const sb = clamp(Math.round((s.speed / 99) * 38 + noise() * 8), 0, 60);
  return { type: "hitter", avg: Math.round(avg * 1000) / 1000, hr, rbi, sb };
}

function formatStatLine(statLine, lang) {
  if (!statLine) return "";
  const l = lang || "fr";
  if (statLine.type === "pitcher") {
    if (l === "en") return `${statLine.wins}-${statLine.losses}, ${statLine.era.toFixed(2)} ERA, ${statLine.k} strikeouts`;
    if (l === "es") return `${statLine.wins}-${statLine.losses}, ${statLine.era.toFixed(2)} EFE, ${statLine.k} ponches`;
    return `${statLine.wins}-${statLine.losses}, ${statLine.era.toFixed(2)} MPM, ${statLine.k} retraits sur prises`;
  }
  const avgStr = statLine.avg.toFixed(3).replace(/^0/, "");
  if (l === "en") return `${avgStr} AVG, ${statLine.hr} HR, ${statLine.rbi} RBI`;
  if (l === "es") return `${avgStr} PROM, ${statLine.hr} jonrones, ${statLine.rbi} carreras impulsadas`;
  return `${avgStr} PM, ${statLine.hr} circuits, ${statLine.rbi} points produits`;
}

function accumulateCareerStats(player, statLine) {
  if (!player.careerStats) player.careerStats = { hr: 0, rbi: 0, sb: 0, wins: 0, losses: 0, k: 0, bestAvg: 0, bestEra: null };
  const cs = player.careerStats;
  if (statLine.type === "pitcher") {
    cs.wins += statLine.wins;
    cs.losses += statLine.losses;
    cs.k += statLine.k;
    if (cs.bestEra === null || statLine.era < cs.bestEra) cs.bestEra = statLine.era;
  } else {
    cs.hr += statLine.hr;
    cs.rbi += statLine.rbi;
    cs.sb += statLine.sb;
    if (statLine.avg > cs.bestAvg) cs.bestAvg = statLine.avg;
  }
}

function checkStatAwards(player, c, statLine, perf) {
  const newAwards = [];
  const fmtAvg = (v) => v.toFixed(3).replace(/^0/, "");
  if (statLine.type === "hitter") {
    if (statLine.avg >= 0.320 && perf >= 65 && Math.random() < 0.22) {
      player.trophies.push(`${c.battingTitleAward} (${player.year}e saison, ${fmtAvg(statLine.avg)})`);
      player.careerPoints += TROPHY_POINTS.statTitle;
      newAwards.push(c.battingTitleAward);
      log(player, `Termine la saison à ${fmtAvg(statLine.avg)} de moyenne : sacré ${c.battingTitleAward} !`);
    }
    if (statLine.hr >= 38 && perf >= 60 && Math.random() < 0.22) {
      player.trophies.push(`${c.hrTitleAward} (${player.year}e saison, ${statLine.hr} circuits)`);
      player.careerPoints += TROPHY_POINTS.statTitle;
      newAwards.push(c.hrTitleAward);
      log(player, `Frappe ${statLine.hr} circuits cette saison : ${c.hrTitleAward} !`);
    }
    if (statLine.rbi >= 110 && perf >= 60 && Math.random() < 0.2) {
      player.trophies.push(`${c.rbiTitleAward} (${player.year}e saison, ${statLine.rbi} points produits)`);
      player.careerPoints += TROPHY_POINTS.statTitle;
      newAwards.push(c.rbiTitleAward);
      log(player, `Pousse ${statLine.rbi} points produits cette saison : ${c.rbiTitleAward} !`);
    }
  } else {
    if (statLine.wins >= 17 && statLine.era <= 3.2 && Math.random() < 0.25) {
      player.trophies.push(`${c.pitcherAward} (${player.year}e saison, ${statLine.wins}-${statLine.losses}, ${statLine.era.toFixed(2)} MPM)`);
      player.careerPoints += TROPHY_POINTS.statTitle;
      newAwards.push(c.pitcherAward);
      log(player, `Termine ${statLine.wins}-${statLine.losses} avec ${statLine.era.toFixed(2)} de moyenne de points mérités : ${c.pitcherAward} !`);
    }
    if (statLine.k >= 220 && Math.random() < 0.22) {
      player.trophies.push(`${c.kTitleAward} (${player.year}e saison, ${statLine.k} retraits sur prises)`);
      player.careerPoints += TROPHY_POINTS.statTitle;
      newAwards.push(c.kTitleAward);
      log(player, `Inscrit ${statLine.k} retraits sur prises cette saison : ${c.kTitleAward} !`);
    }
  }
  if (player.stats.defense >= 80 && perf >= 60 && Math.random() < 0.15) {
    player.trophies.push(`${c.gloveAward} (${player.year}e saison)`);
    player.careerPoints += TROPHY_POINTS.statTitle;
    newAwards.push(c.gloveAward);
    log(player, `Récompensé pour sa défense d'exception : ${c.gloveAward} !`);
  }
  return newAwards;
}

// ---------- Vieillissement différencié par statistique ----------
// Chaque statistique décline à son propre rythme, à l'image des courbes réelles :
// la vitesse décroche tôt, la puissance et le contact tiennent plus longtemps,
// le contrôle (expérience du lanceur) est la stat la plus stable.

function applyAging(player) {
  const age = player.age;
  if (age > 30) player.stats.speed -= rnd(1, 3);
  else if (age > 27) player.stats.speed -= rnd(0, 1);
  if (age > 33) player.stats.power -= rnd(1, 3);
  else if (age > 30) player.stats.power -= rnd(0, 1);
  if (age > 35) player.stats.contact -= rnd(0, 2);
  if (age > 33) player.stats.defense -= rnd(0, 2);
  if (age > 37) player.stats.control -= rnd(0, 1);
}

// ---------- Fatigue ----------
// Chaque choix laisse une trace : plus l'effet est marqué (santé qui trinque,
// statistiques qui bougent fort), plus la fatigue s'accumule. Elle pèse sur la
// performance de fin de saison puis se résorbe en partie à l'intersaison.

function fatigueFromChoice(diffsSum, healthDelta) {
  let f = 1;
  if (healthDelta < 0) f += Math.abs(healthDelta) * 0.3;
  if (diffsSum > 5) f += 2;
  return Math.round(f * 10) / 10;
}

function applyFatigueRecovery(player) {
  player.fatigue = clamp(Math.round((player.fatigue || 0) * (player.earlyRiser ? 0.3 : 0.45)), 0, 100);
}

// ---------- Blessures à sévérité graduée ----------
// Un tirage en fin de saison, dont la probabilité grimpe avec la fatigue accumulée.

const INJURY_TIERS = [
  { tier: "minor", weight: 0.6, health: [5, 12], moraleHit: [0, 3],
    fr: "Petite gêne musculaire en fin de saison — rien de grave, mais ça se fait sentir.",
    en: "A minor muscle niggle late in the season — nothing serious, but it lingers.",
    es: "Una molestia muscular menor a fin de temporada — nada grave, pero se nota." },
  { tier: "moderate", weight: 0.3, health: [15, 25], moraleHit: [3, 8],
    fr: "Blessure plus sérieuse qui t'oblige à lever le pied sur la fin de saison.",
    en: "A more serious injury forces you to ease off for the rest of the season.",
    es: "Una lesión más seria te obliga a bajar el ritmo el resto de la temporada." },
  { tier: "severe", weight: 0.1, health: [30, 45], moraleHit: [8, 15],
    fr: "Grosse blessure : la fin de saison est compromise et il faudra du temps pour t'en remettre.",
    en: "A major injury: the rest of the season is in jeopardy and recovery will take time.",
    es: "Una lesión grave: el resto de la temporada está en riesgo y la recuperación llevará tiempo." },
];

const CHRONIC_MESSAGES = {
  fr: (label) => `L'examen révèle une fragilité durable : ta ${label.toLowerCase()} ne sera plus jamais tout à fait la même.`,
  en: (label) => `The examination reveals lasting fragility: your ${label.toLowerCase()} will never quite be the same.`,
  es: (label) => `El examen revela una fragilidad duradera: tu ${label.toLowerCase()} nunca volverá a ser exactamente la misma.`,
};
const CAREER_ENDING_MESSAGES = {
  fr: "Le diagnostic tombe, sans appel : cette blessure met un terme prématuré et brutal à ta carrière.",
  en: "The diagnosis comes down, final: this injury brings a premature and brutal end to your career.",
  es: "El diagnóstico es definitivo: esta lesión pone un final prematuro y brutal a tu carrera.",
};

function checkRandomInjury(player) {
  const fatigue = player.fatigue || 0;
  const chronicBoost = player.chronicIssue ? 0.04 : 0;
  const fragileBoost = player.fragile ? 0.05 : 0;
  const chance = 0.06 + fatigue / 250 + chronicBoost + fragileBoost;
  if (Math.random() >= chance) return null;
  const roll = Math.random();
  let acc = 0, chosen = INJURY_TIERS[0];
  for (const t of INJURY_TIERS) { acc += t.weight; if (roll <= acc) { chosen = t; break; } }
  player.health -= rnd(chosen.health[0], chosen.health[1]);
  player.morale -= rnd(chosen.moraleHit[0], chosen.moraleHit[1]);
  log(player, chosen.fr);
  if (chosen.tier === "severe") {
    player.stats.speed -= rnd(0, 2);
    if (!player.careerEndingInjury && Math.random() < 0.08) {
      player.careerEndingInjury = true;
      player.health = Math.min(player.health, 15);
      log(player, CAREER_ENDING_MESSAGES.fr);
    } else if (!player.chronicIssue && Math.random() < 0.15) {
      const statKeys = ["power", "speed", "contact", "defense", "control"];
      const key = pick(statKeys);
      const loss = rnd(4, 9);
      player.stats[key] = clamp((player.stats[key] || 0) - loss, 1, 99);
      player.chronicIssue = { stat: key, since: player.year };
      log(player, CHRONIC_MESSAGES.fr(STAT_LABELS[key]));
    }
  }
  return chosen;
}

// ---------- Météo (événements de match) ----------

const WEATHER_TYPES = [
  { id: "clear", weight: 0.5, fatigue: 0, healthRisk: 0, fr: "☀️ Sous un grand soleil, ", en: "☀️ Under bright sunshine, ", es: "☀️ Bajo un sol radiante, " },
  { id: "rain", weight: 0.25, fatigue: 3, healthRisk: 4, fr: "🌧️ Sous une pluie battante, ", en: "🌧️ Under pouring rain, ", es: "🌧️ Bajo una lluvia intensa, " },
  { id: "heat", weight: 0.15, fatigue: 4, healthRisk: 1, fr: "🥵 Dans une chaleur étouffante, ", en: "🥵 In stifling heat, ", es: "🥵 Con un calor sofocante, " },
  { id: "wind", weight: 0.10, fatigue: 1, healthRisk: 0, fr: "💨 Sous un vent capricieux, ", en: "💨 In gusty winds, ", es: "💨 Con un viento caprichoso, " },
];

function rollWeather() {
  const roll = Math.random();
  let acc = 0, chosen = WEATHER_TYPES[0];
  for (const w of WEATHER_TYPES) { acc += w.weight; if (roll <= acc) { chosen = w; break; } }
  return chosen;
}

// ---------- Rivaux nommés ----------
// Trois adversaires récurrents, générés à la création du joueur, toujours d'un
// autre pays, jamais homonymes entre eux ni avec le joueur.

function generateRivals(player) {
  const otherCountries = Object.keys(COUNTRIES).filter(k => k !== player.country);
  const rivals = [];
  const used = new Set([player.name]);
  for (let i = 0; i < 3; i++) {
    const country = pick(otherCountries);
    let name, tries = 0;
    do { name = randomName(country); tries++; } while (used.has(name) && tries < 25);
    used.add(name);
    rivals.push({ name, country, strength: rnd(40, 78) });
  }
  return rivals;
}

function compareToRival(player, rival) {
  const ov = overall(player);
  const diff = ov - rival.strength + rnd(-15, 15);
  return diff >= 0;
}

// ---------- Coéquipier récurrent ----------

const TEAMMATE_ARCHETYPES = ["veteran", "rookie", "journeyman"];

function generateTeammate(player) {
  return { name: randomName(player.country), archetype: pick(TEAMMATE_ARCHETYPES), affinity: 50, team: player.team };
}

function ensureTeammate(player) {
  if (!player.teammate || player.teammate.team !== player.team) {
    player.teammate = generateTeammate(player);
  }
  return player.teammate;
}

// ---------- Rivalité de club ----------
// Chaque club a un grand rival historique, déterminé par sa position dans la liste
// des équipes du pays (paires 0-1, 2-3, etc.) — stable et sans configuration manuelle.

function getClubRival(country, team) {
  const c = COUNTRIES[country];
  const idx = c.teams.indexOf(team);
  if (idx === -1) return null;
  const rivalIdx = idx % 2 === 0 ? idx + 1 : idx - 1;
  if (rivalIdx < 0 || rivalIdx >= c.teams.length) return null;
  return c.teams[rivalIdx];
}

function ensureClubRival(player) {
  const rival = getClubRival(player.country, player.team);
  player.clubRival = rival;
  return rival;
}

// ---------- Sponsor personnel ----------
// Distinct du contrat de club : un sponsor "exigeant" paie mieux mais rompt le
// contrat si la saison ne rapporte aucun trophée ; un sponsor "fidèle" paie
// moins mais reste jusqu'au bout.

const SPONSOR_BRANDS = ["ProSwing Gear", "Diamond Turf", "Apex Cleats", "Big League Fuel", "Iron Grip Bats", "Velocity Sports"];

function checkSponsorStatus(player, trophyCountBefore) {
  if (!player.sponsor) return;
  player.sponsor.seasonsActive = (player.sponsor.seasonsActive || 0) + 1;
  const wonTrophyThisSeason = player.trophies.length > trophyCountBefore;
  if (player.sponsor.personality === "demanding" && !wonTrophyThisSeason && Math.random() < 0.5) {
    log(player, `${player.sponsor.brand} rompt ton contrat de sponsoring, faute de résultats cette saison.`);
    player.sponsor = null;
    player.morale -= rnd(3, 6);
  } else if (wonTrophyThisSeason) {
    player.reputation += rnd(1, 3);
  }
}

function createPlayer(countryKey, position, name) {
  const country = COUNTRIES[countryKey];
  const isPitcher = position === "Lanceur";
  const isCatcher = position === "Receveur";
  const isShortstop = position === "Arrêt-court";
  const player = {
    name: name || randomName(countryKey),
    country: countryKey,
    startCountry: countryKey,
    position,
    age: 16,
    year: 0,
    team: null,
    level: 0, // index dans country.minorLevels, puis topLevel
    inTopLeague: false,
    retired: false,
    careerPoints: 0,
    championshipsWon: 0,
    salary: 0,
    contractYearsLeft: 0,
    seasonsSinceTransferEvent: 0,
    seasonsSinceIntlTransferEvent: 0,
    teamStrengths: {},
    seasonHistory: [],
    fatigue: 0,
    rivals: [],
    rivalWins: 0,
    teammate: null,
    clubRival: null,
    derbyWins: 0,
    chronicIssue: null,
    careerEndingInjury: false,
    leagueStandings: null,
    sponsor: null,
    pendingInterview: null,
    confidentBet: null,
    stats: {
      contact: rnd(30, 55),
      power: rnd(30, 55),
      // Profils de départ archétypaux : le Receveur démarre plus solide défensivement
      // mais moins véloce, l'Arrêt-court est plus athlétique/rapide dès le départ.
      speed: clamp(rnd(30, 55) + (isCatcher ? -5 : isShortstop ? 5 : 0), 1, 99),
      defense: clamp(rnd(30, 55) + (isCatcher ? 5 : 0), 1, 99),
      control: isPitcher ? rnd(35, 60) : clamp(rnd(20, 40) + (isCatcher ? 5 : 0), 1, 99),
    },
    morale: 70,
    health: 100,
    reputation: 20,
    salaryTier: 0,
    trophies: [],
    history: [], // journal de carrière
    isPitcher,
    isCatcher,
    isShortstop,
    draftInfo: null,
    trait: null,
  };
  player.rivals = generateRivals(player);
  const trait = pick(TRAITS);
  trait.apply(player);
  player.trait = trait.label;
  log(player, `Trait de carrière : ${trait.label}.`);
  return player;
}

function overall(player) {
  const s = player.stats;
  // Chaque poste valorise différemment les 5 stats : le Receveur profite d'un profil
  // défense/instinct fort mais peu véloce, l'Arrêt-court d'un profil athlétique où la
  // vitesse compte presque autant que le contact — plutôt qu'une formule identique.
  let base;
  if (player.isPitcher) base = s.control * 0.45 + s.defense * 0.2 + s.speed * 0.1 + s.power * 0.1 + s.contact * 0.15;
  else if (player.isCatcher) base = s.contact * 0.28 + s.power * 0.2 + s.speed * 0.07 + s.defense * 0.3 + s.control * 0.15;
  else if (player.isShortstop) base = s.contact * 0.28 + s.power * 0.18 + s.speed * 0.28 + s.defense * 0.21 + s.control * 0.05;
  else base = s.contact * 0.3 + s.power * 0.25 + s.speed * 0.2 + s.defense * 0.2 + s.control * 0.05;
  return clamp(Math.round(base), 1, 99);
}

function log(player, text) {
  player.history.push(`[${player.age} ans] ${text}`);
}

function resolveDraft(player, countryKey, opts) {
  const c = COUNTRIES[countryKey];
  const ov = overall(player);
  let roundText, teamIdx;

  if (countryKey === "usa") {
    // Ordre inversé au classement : plus l'overall est haut, plus le tour est précoce.
    const round = clamp(Math.ceil((70 - ov) / 6) + (opts.boldness ? 0 : -1), 1, 20);
    teamIdx = rnd(0, c.teams.length - 1);
    if (ov < 32 && Math.random() < 0.3) {
      player.draftInfo = { drafted: false, note: "Non repêché — signé comme agent libre amateur." };
      player.team = c.teams[teamIdx];
      log(player, `Non sélectionné au SSL Draft, signe comme agent libre avec les ${player.team}.`);
    } else {
      player.team = c.teams[teamIdx];
      player.draftInfo = { drafted: true, round };
      log(player, `Sélectionné au ${round}e tour du SSL Draft par les ${player.team}.`);
    }
    player.level = 0;
    player.salary = Math.round(initialSalary("usa", 1 - (player.draftInfo.round ? player.draftInfo.round / 20 : 0.6)));
    player.contractYearsLeft = rnd(1, 3);
    log(player, `Premier contrat : $${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
  }

  if (countryKey === "japan") {
    // Système de kuji (loterie) si plusieurs équipes déclarent le même choix n°1.
    const rivals = opts.koshien ? rnd(0, 3) : rnd(0, 1);
    teamIdx = rnd(0, c.teams.length - 1);
    if (ov >= 55 && rivals > 0) {
      const won = Math.random() < 1 / (rivals + 1);
      player.team = c.teams[teamIdx];
      player.draftInfo = { drafted: true, lottery: true, rivals, won };
      log(player, won
        ? `${rivals + 1} équipes te voulaient en 1er choix : les ${player.team} remportent le tirage au sort (kuji) !`
        : `${rivals + 1} équipes te voulaient en 1er choix : les ${player.team} l'emportent au tirage au sort et te sélectionnent quand même en 1er tour.`);
    } else if (ov < 35) {
      player.team = c.teams[teamIdx];
      player.draftInfo = { drafted: true, ikusei: true };
      log(player, `Sélectionné au Draft de développement (Ikusei) par les ${player.team} — il faudra gravir les échelons du ni-gun.`);
    } else {
      player.team = c.teams[teamIdx];
      player.draftInfo = { drafted: true };
      log(player, `Sélectionné au Draft SDL par les ${player.team}.`);
    }
    player.level = 0;
    player.salary = Math.round(initialSalary("japan", ov / 70));
    player.contractYearsLeft = rnd(1, 3);
    log(player, `Premier contrat : ¥${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
  }

  if (countryKey === "kr") {
    const round = clamp(Math.ceil((70 - ov) / 7), 1, 11);
    teamIdx = rnd(0, c.teams.length - 1);
    player.team = c.teams[teamIdx];
    player.draftInfo = { drafted: true, round };
    log(player, `Sélectionné au ${round}e tour du Draft national unique de la MCBL par les ${player.team}.`);
    player.level = 0;
    player.salary = Math.round(initialSalary("kr", 1 - round / 11));
    player.contractYearsLeft = rnd(1, 3);
    log(player, `Premier contrat : ₩${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
  }

  if (countryKey === "tw") {
    const round = clamp(Math.ceil((70 - ov) / 7) + (opts.boldness ? 0 : -1), 1, 10);
    teamIdx = rnd(0, c.teams.length - 1);
    player.team = c.teams[teamIdx];
    player.draftInfo = { drafted: true, round };
    log(player, `Sélectionné au ${round}e tour du Draft FDL par les ${player.team}.`);
    player.level = 0;
    player.salary = Math.round(initialSalary("tw", 1 - round / 10));
    player.contractYearsLeft = rnd(1, 3);
    log(player, `Premier contrat : NT$${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
  }
}

function signWithAcademy(player, opts, countryKey) {
  countryKey = countryKey || "mx";
  const c = COUNTRIES[countryKey];
  const teamIdx = rnd(0, c.teams.length - 1);
  player.team = c.teams[teamIdx];
  if (!opts.hometown && Math.random() < 0.35) {
    const bonus = rnd(2, 5);
    player.stats.power += bonus;
    player.reputation += 8;
    player.draftInfo = { bidding: true, bonus };
    log(player, `Plusieurs clubs se disputent ta signature : les ${player.team} l'emportent avec une prime à la signature.`);
  } else {
    player.draftInfo = { bidding: false };
    log(player, `Signe avec l'académie des ${player.team}, sans passer par un draft.`);
  }
  player.level = 0;
  player.salary = Math.round(initialSalary(countryKey, opts.hometown ? 0.3 : 0.6));
  player.contractYearsLeft = rnd(1, 3);
  log(player, `Premier contrat : ${c.currency}${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
}

function assignToProvince(player, opts) {
  const c = COUNTRIES.cu;
  const teamIdx = rnd(0, c.teams.length - 1);
  player.team = c.teams[teamIdx];
  if (opts.requestedStrongerTeam) {
    player.reputation += 6;
    player.stats.defense += rnd(1, 4);
    log(player, `Après une démarche insistante, tu es affecté aux ${player.team}, une équipe provinciale reconnue.`);
  } else {
    player.morale += 8;
    log(player, `Tu es affecté aux ${player.team}, l'équipe de ta province d'origine.`);
  }
  player.level = 0;
  player.draftInfo = { bidding: false };
  player.salary = Math.round(initialSalary("cu", opts.requestedStrongerTeam ? 0.5 : 0.3));
  player.contractYearsLeft = rnd(1, 3);
  log(player, `Premier contrat : ${c.currency}${formatMoney(player.salary)} /an sur ${player.contractYearsLeft} saison(s).`);
}

function seasonEventPool(player) {
  const gens = allSeasonEventGenerators(player);
  const always = gens.filter(g => g.always);
  const optional = gens.filter(g => !g.always).filter(g => {
    if (g.onlyIfTop && !player.inTopLeague) return false;
    if (g.onlyIfMinors && player.inTopLeague) return false;
    if (g.onlyIfPitcher && !player.isPitcher) return false;
    if (g.onlyIfPosition && !g.onlyIfPosition.includes(player.position)) return false;
    if (g.minYearsInTop && (player.yearsInTop || 0) < g.minYearsInTop) return false;
    if (g.customCheck && !g.customCheck(player)) return false;
    return true;
  });

  // Échantillonnage pondéré sans remise : les événements avec un poids plus élevé
  // (ex. contrats/transferts) reviennent plus souvent, sans jamais doublonner
  // dans la même saison (chaque générateur n'apparaît qu'une fois dans le pool).
  const withKeys = optional.map(g => {
    // Poids contextuel optionnel : certains events deviennent plus probables selon
    // l'état du joueur (fatigue, moral, réputation...) pour que le jeu semble réagir
    // à sa situation plutôt que de piocher uniformément.
    const ctx = g.contextWeight ? clamp(g.contextWeight(player), 0.2, 5) : 1;
    return { g, key: Math.pow(rndFloat(), 1 / ((g.weight || 1) * ctx)) };
  });
  withKeys.sort((a, b) => b.key - a.key);
  const targetTotal = rnd(3, 4);
  const extraCount = clamp(targetTotal - always.length, 1, withKeys.length);
  let chosenOptional = withKeys.slice(0, extraCount).map(x => x.g);

  // Garantie anti-malchance : si aucun événement de transfert/contrat n'est apparu
  // depuis 3 saisons alors qu'un tel événement est disponible cette saison, on l'insère de force.
  const transferCandidates = optional.filter(g => g.transferType);
  const seasonsWithout = player.seasonsSinceTransferEvent || 0;
  const alreadyHasTransfer = chosenOptional.some(g => g.transferType);
  if (!alreadyHasTransfer && seasonsWithout >= 3 && transferCandidates.length) {
    chosenOptional[chosenOptional.length - 1] = pick(transferCandidates);
  }
  player.seasonsSinceTransferEvent = chosenOptional.some(g => g.transferType) ? 0 : seasonsWithout + 1;

  // Garantie dédiée aux opportunités internationales (posting / vente à l'étranger) :
  // les transferts domestiques (fréquents, poids 2.5) réinitialisaient le compteur
  // ci-dessus avant que le posting n'ait la moindre chance d'être forcé. On isole donc
  // un compteur propre à ces occasions rares mais marquantes, garanties dans les 2
  // saisons suivant l'éligibilité (ex: 7 saisons au sommet pour le Japon/la Corée).
  const intlCandidates = optional.filter(g => g.internationalTransferType);
  const seasonsWithoutIntl = player.seasonsSinceIntlTransferEvent || 0;
  const alreadyHasIntl = chosenOptional.some(g => g.internationalTransferType);
  if (!alreadyHasIntl && seasonsWithoutIntl >= 2 && intlCandidates.length) {
    const replaceIdx = chosenOptional.findIndex(g => !g.transferType);
    chosenOptional[replaceIdx >= 0 ? replaceIdx : chosenOptional.length - 1] = pick(intlCandidates);
  }
  player.seasonsSinceIntlTransferEvent = chosenOptional.some(g => g.internationalTransferType) ? 0 : (intlCandidates.length ? seasonsWithoutIntl + 1 : seasonsWithoutIntl);

  const chosen = [...always, ...chosenOptional];

  return chosen.map(g => {
    const ev = g.build();
    ev.category = g.category || "carrière";
    if (ev.category === "match") {
      const weather = rollWeather();
      ev.weather = weather;
      ev.text = weather.fr + ev.text.charAt(0).toLowerCase() + ev.text.slice(1);
      if (Math.random() < 0.35 && ev.choices.length === 2) {
        const statKeys = ["power", "speed", "contact", "defense", "control"];
        const key = pick(statKeys);
        ev.choices = ev.choices.concat([{
          label: "Tenter un geste totalement audacieux",
          sub: "Effet aléatoire fort, quitte ou double",
          result: "Tu tentes un geste totalement fou, sous les yeux ébahis du stade — pile ou face absolu.",
          apply: (p) => {
            // Un joueur clutch encaisse mieux le quitte ou double : le pire est moins pire,
            // le meilleur est meilleur, et le coup a plus de chances de payer.
            const swing = p.clutch ? rnd(-3, 18) : rnd(-8, 14);
            p.stats[key] = clamp((p.stats[key] || 0) + swing, 1, 99);
            p.health -= rnd(0, 6);
            if (Math.random() < (p.clutch ? 0.5 : 0.3)) { p.reputation += rnd(5, 10); log(p, "Le coup fou paie, la foule est en délire !"); }
          },
        }]);
      }
    } else if (ev.category === "carrière" && Math.random() < 0.2 && ev.choices.length === 2) {
      // Option à risque caché : contrairement aux autres choix, sa fourchette n'est pas
      // annoncée à l'avance — seule l'incertitude l'est, pour de vraies décisions à l'aveugle.
      ev.choices = ev.choices.concat([{
        label: "Tenter le coup de poker, sans filet",
        sub: "Conséquence incertaine, à double tranchant",
        result: "Tu joues le tout pour le tout, sans vraiment savoir ce que ça va donner.",
        apply: (p) => {
          const success = Math.random() < (p.clutch ? 0.55 : 0.4);
          if (success) {
            p.reputation = clamp(p.reputation + rnd(6, 14), 0, 100);
            p.salary = Math.round(p.salary * (1 + rnd(2, 8) / 100));
            log(p, "Le pari risqué paie largement !");
          } else {
            p.reputation = clamp(p.reputation - rnd(4, 10), 0, 100);
            p.morale = clamp(p.morale - rnd(2, 6), 0, 100);
            log(p, "Le pari risqué se retourne contre toi.");
          }
        },
      }]);
    }
    return ev;
  });
}


// ---------- Boucle de saison ----------

function playSeason(player, decisions) {
  // decisions: tableau d'index de choix pour chaque événement de la saison, dans l'ordre fourni par seasonEventPool
  player.year += 1;
  player.age += 1;
  if (player.yearsInTop === undefined) player.yearsInTop = 0;

  const events = seasonEventPool(player);
  const chosen = [];
  events.forEach((ev, i) => {
    const choiceIdx = decisions && decisions[i] !== undefined ? decisions[i] : rnd(0, ev.choices.length - 1);
    const choice = ev.choices[clamp(choiceIdx, 0, ev.choices.length - 1)];
    const before = pointsSnapshot(player);
    choice.apply(player);
    const after = pointsSnapshot(player);
    const diff = sumPointsDiff(before, after);
    player.careerPoints = (player.careerPoints || 0) + diff;
    let extraFatigue = 0, extraHealthRisk = 0;
    if (ev.weather) { extraFatigue = ev.weather.fatigue; extraHealthRisk = ev.weather.healthRisk; }
    if (extraHealthRisk && Math.random() < 0.3) player.health = clamp(player.health - rnd(1, extraHealthRisk), 0, 100);
    player.fatigue = clamp((player.fatigue || 0) + fatigueFromChoice(Math.abs(diff), after.health - before.health) + extraFatigue, 0, 100);
    chosen.push({ event: ev.title, choice: choice.label });
  });

  clampStats(player);
  if (player.team) { ensureTeammate(player); ensureClubRival(player); }
  const c = COUNTRIES[player.country];
  const ov = overall(player);
  if (!player.inTopLeague) {
    const promoChance = clamp(0.22 + ov / 180, 0.22, 0.72);
    if (Math.random() < promoChance) {
      if (player.level < c.minorLevels.length - 1) {
        player.level += 1;
        log(player, `Promu à l'échelon ${c.minorLevels[player.level]}.`);
      } else {
        player.inTopLeague = true;
        log(player, `Appelé en ${c.topLevel} pour la première fois !`);
      }
    }
  } else {
    player.yearsInTop += 1;
  }

  // Performance de fin de saison
  const perf = clamp(ov + rnd(-10, 10) + Math.round((player.morale - 50) / 10) - Math.round((100 - player.health) / 15) - Math.round((player.fatigue || 0) / 12), 1, 99);
  const statLine = generateStatLine(player, perf);
  const seasonLine = { year: player.year, age: player.age, team: player.team, level: player.inTopLeague ? c.topLevel : c.minorLevels[player.level], perf, ov, statLine };
  player.lastSeasonLine = seasonLine;
  if (player.inTopLeague) {
    accumulateCareerStats(player, statLine);
    player.leagueStandings = generateStandings(player, perf);
  }

  // Résolution du pari de confiance fait en interview la saison précédente
  if (player.confidentBet) {
    if (perf >= player.confidentBet.threshold) {
      player.reputation += rnd(4, 8);
      log(player, `Ton pari de confiance en interview paie : la saison suit derrière les mots !`);
    } else {
      player.reputation -= rnd(4, 8);
      log(player, `Ton pari de confiance en interview se retourne contre toi : la saison ne suit pas.`);
    }
    player.confidentBet = null;
  }

  const trophyCountBefore = player.trophies.length;
  if (player.inTopLeague) {
    if (perf >= 88 && Math.random() < 0.3) {
      player.trophies.push(`${c.mvpAward} (${player.year}e saison)`);
      player.careerPoints += TROPHY_POINTS.mvp;
      log(player, `Élu ${c.mvpAward} de la ligue !`);
      player.pendingInterview = { type: "mvp" };
    } else if (perf >= 80 && Math.random() < 0.5) {
      player.trophies.push(`Sélection All-Star (${player.year}e saison)`);
      player.careerPoints += TROPHY_POINTS.allstar;
      log(player, `Sélectionné pour le match des étoiles.`);
    }
    if (player.yearsInTop === 1 && perf >= 68) {
      player.trophies.push(`${c.rookieAward}`);
      player.careerPoints += TROPHY_POINTS.rookie;
      log(player, `Élu ${c.rookieAward} !`);
    }
    const standings = player.leagueStandings || [];
    const teamRank = standings.findIndex((row) => row.team === player.team) + 1;
    if (teamRank === 1) {
      player.trophies.push(`${c.trophy} (${player.year}e saison)`);
      player.careerPoints += TROPHY_POINTS.championship;
      player.championshipsWon = (player.championshipsWon || 0) + 1;
      log(player, `${player.team} termine 1re du classement et remporte le titre ultime : ${c.trophy} !`);
      player.pendingInterview = { type: "championship" };
    } else if (teamRank > 0) {
      log(player, `${player.team} termine ${teamRank}e du classement de la ligue cette saison — pas de titre cette fois.`);
    }
    checkStatAwards(player, c, statLine, perf);
  }
  checkSponsorStatus(player, trophyCountBefore);

  // Vieillissement différencié par statistique
  applyAging(player);
  checkRandomInjury(player);
  applyFatigueRecovery(player);
  player.health = clamp(player.health + rnd(2, 8), 40, 100);
  clampStats(player);

  // Décompte et renouvellement de contrat
  if (player.salary > 0) {
    player.contractYearsLeft = (player.contractYearsLeft || 0) - 1;
    if (player.contractYearsLeft <= 0) renewContract(player);
  }

  return { events: chosen, seasonLine };
}

function clampStats(player) {
  for (const k in player.stats) player.stats[k] = clamp(player.stats[k], 1, 99);
  player.morale = clamp(player.morale, 0, 100);
  player.reputation = clamp(player.reputation, 0, 100);
  player.health = clamp(player.health, 0, 100);
}

function shouldForceRetire(player) {
  if (player.careerEndingInjury) return true;
  if (player.age >= 42) return true;
  if (player.health <= 0) return true;
  if (player.age >= 34 && overall(player) < 25) return true;
  return false;
}

function careerReport(player) {
  const ov = overall(player);
  const trophyScore = player.trophies.length * 2.2;
  const longevity = clamp(player.yearsInTop || 0, 0, 20);
  const score = clamp(Math.round(ov * 0.45 + trophyScore + longevity * 0.9 + player.reputation * 0.12), 1, 99);
  let tier;
  if (score >= 90) tier = "Légende — Hall of Fame";
  else if (score >= 75) tier = "Superstar";
  else if (score >= 60) tier = "Titulaire All-Star";
  else if (score >= 45) tier = "Joueur solide de rotation";
  else if (score >= 30) tier = "Journeyman / role player";
  else tier = "Carrière en dents de scie";
  return {
    score, tier, trophies: player.trophies, yearsInTop: player.yearsInTop || 0,
    finalTeam: player.team, finalCountry: player.country, startCountry: player.startCountry || player.country,
    points: player.careerPoints || 0, championshipsWon: player.championshipsWon || 0,
  };
}
