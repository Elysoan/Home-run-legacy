function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function ensureDailyChallenges() {
  const today = todayKey();
  let state = null;
  try {
    const raw = await Store.get("daily-challenges");
    if (raw) state = JSON.parse(raw);
  } catch (e) { /* on régénère ci-dessous */ }
  if (!state || state.date !== today) {
    // Tirage pondéré : les défis portant sur un pays ou un poste jamais essayé
    // reviennent plus souvent, pour pousser à la découverte plutôt qu'à répéter
    // toujours les mêmes carrières. Les autres défis gardent un poids normal.
    let achMeta = null;
    try { achMeta = (await loadAchState()).meta; } catch (e) { /* repli ci-dessous */ }
    const countriesPlayed = (achMeta && achMeta.countriesPlayed) || [];
    const positionsPlayed = (achMeta && achMeta.positionsPlayed) || [];
    const DISCOVERY_WEIGHT = 4;
    const withKeys = DAILY_CHALLENGE_POOL.map(c => {
      const isUndiscoveredCountry = c.discoverCountry && !countriesPlayed.includes(c.discoverCountry);
      const isUndiscoveredPosition = c.discoverPosition && !positionsPlayed.includes(c.discoverPosition);
      const weight = (isUndiscoveredCountry || isUndiscoveredPosition) ? DISCOVERY_WEIGHT : 1;
      return { c, key: Math.pow(Math.random(), 1 / weight) };
    });
    withKeys.sort((a, b) => b.key - a.key);
    const picked = withKeys.slice(0, 3).map(x => x.c.id);
    state = { date: today, challengeIds: picked, completed: {} };
    await Store.set("daily-challenges", JSON.stringify(state));
  }
  return state;
}

async function evaluateDailyChallenges(summary) {
  const state = await ensureDailyChallenges();
  let changed = false;
  const newlyCompleted = [];
  state.challengeIds.forEach(id => {
    if (state.completed[id]) return;
    const def = DAILY_CHALLENGE_POOL.find(c => c.id === id);
    if (def && def.check(summary)) {
      state.completed[id] = true;
      changed = true;
      newlyCompleted.push(def);
    }
  });
  if (changed) await Store.set("daily-challenges", JSON.stringify(state));
  return { state, newlyCompleted };
}

async function recordCompletedCareer(player, report) {
  const summary = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    name: player.name, startCountry: player.startCountry, finalCountry: report.finalCountry,
    position: player.position, points: report.points, tier: report.tier,
    trophyCount: report.trophies.length, championshipsWon: report.championshipsWon,
    yearsInTop: report.yearsInTop, finalTeam: report.finalTeam, completedAt: new Date().toISOString(),
    trophies: report.trophies.slice(), isPitcher: player.isPitcher, careerStats: player.careerStats || null,
  };
  const careers = await loadCareers();
  careers.push(summary);
  await saveCareers(careers);

  const achState = await loadAchState();
  const m = achState.meta;
  m.totalCareers += 1;
  m.totalChampionships += report.championshipsWon;
  if (report.tier.startsWith("Légende")) m.reachedLegend = true;
  if (!m.countriesPlayed.includes(player.startCountry)) m.countriesPlayed.push(player.startCountry);
  if (!m.positionsPlayed.includes(player.position)) m.positionsPlayed.push(player.position);
  if (report.finalCountry !== player.startCountry) m.countryChanges += 1;
  m.longestYearsInTop = Math.max(m.longestYearsInTop, report.yearsInTop);

  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a => {
    if (!achState.unlocked[a.id] && a.check(m)) {
      achState.unlocked[a.id] = new Date().toISOString();
      newlyUnlocked.push(a);
    }
  });
  await saveAchState(achState);

  const dailyResult = await evaluateDailyChallenges(summary);

  return { summary, newlyUnlocked, dailyNewlyCompleted: dailyResult.newlyCompleted };
}

// ---------- Snapshot / diff pour afficher les conséquences chiffrées ----------

const DIFF_LABELS = { contact: "Contact", power: "Puissance", speed: "Vitesse", defense: "Défense", control: "Contrôle", morale: "Moral", health: "Santé", reputation: "Réputation" };

function snapshotPlayer(p) {
  return {
    contact: p.stats.contact, power: p.stats.power, speed: p.stats.speed, defense: p.stats.defense, control: p.stats.control,
    morale: p.morale, health: p.health, reputation: p.reputation, team: p.team, country: p.country,
  };
}

function diffPlayer(before, after) {
  const lines = [];
  for (const k in DIFF_LABELS) {
    const d = after[k] - before[k];
    if (d !== 0) lines.push({ label: DIFF_LABELS[k], delta: d });
  }
  if (before.team !== after.team) lines.push({ label: "Équipe", text: `${before.team || "—"} → ${after.team}` });
  if (before.country !== after.country) lines.push({ label: "Pays", text: `${countryName(before.country)} → ${countryName(after.country)}` });
  return lines;
}

function sumDiffPoints(diffs) {
  return diffs.reduce((total, d) => total + (typeof d.delta === "number" ? d.delta : 0), 0);
}

const STAT_GENDER = { Contact: "m", Puissance: "f", Vitesse: "f", Défense: "f", Contrôle: "m", Moral: "m", Santé: "f", Réputation: "f" };
function poss(label) { return STAT_GENDER[label] === "m" ? "ton" : "ta"; }
function joinFr(arr) {
  if (arr.length <= 1) return arr[0] || "";
  return arr.slice(0, -1).join(", ") + " et " + arr[arr.length - 1];
}

function narrativeFromDiffs(diffs) {
  const gains = diffs.filter(d => typeof d.delta === "number" && d.delta > 0);
  const losses = diffs.filter(d => typeof d.delta === "number" && d.delta < 0);
  const teamChange = diffs.find(d => d.label === "Équipe");
  const countryChange = diffs.find(d => d.label === "Pays");

  if (STATE.lang === "en") {
    const parts = [];
    if (gains.length) parts.push(`your ${gains.map(d => statLabel(d.label).toLowerCase()).join(" and ")} ${gains.length > 1 ? "improve" : "improves"}`);
    if (losses.length) parts.push(`your ${losses.map(d => statLabel(d.label).toLowerCase()).join(" and ")} ${losses.length > 1 ? "suffer" : "suffers"}`);
    let sentence = parts.length ? parts.join(", while ") + "." : "Nothing measurable comes of it, but every choice counts.";
    sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
    if (teamChange) sentence += ` ${teamChange.text}.`;
    if (countryChange) sentence += ` ${countryChange.text}.`;
    return sentence;
  }
  if (STATE.lang === "es") {
    const parts = [];
    if (gains.length) parts.push(`tu ${gains.map(d => statLabel(d.label).toLowerCase()).join(" y ")} mejora${gains.length > 1 ? "n" : ""}`);
    if (losses.length) parts.push(`tu ${losses.map(d => statLabel(d.label).toLowerCase()).join(" y ")} se resiente${losses.length > 1 ? "n" : ""}`);
    let sentence = parts.length ? parts.join(", mientras que ") + "." : "No hay nada medible, pero cada decisión cuenta.";
    sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
    if (teamChange) sentence += ` ${teamChange.text}.`;
    if (countryChange) sentence += ` ${countryChange.text}.`;
    return sentence;
  }

  const parts = [];
  if (gains.length) {
    const names = gains.map(d => `${poss(d.label)} ${d.label.toLowerCase()}`);
    parts.push(`${joinFr(names)} ${gains.length > 1 ? "progressent" : "progresse"}`);
  }
  if (losses.length) {
    const names = losses.map(d => `${poss(d.label)} ${d.label.toLowerCase()}`);
    parts.push(`${joinFr(names)} ${losses.length > 1 ? "en pâtissent" : "en pâtit"}`);
  }
  let sentence = parts.length ? parts.join(", tandis que ") + "." : "Rien de mesurable n'en ressort, mais chaque choix compte.";
  sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
  if (teamChange) sentence += ` ${teamChange.text}.`;
  if (countryChange) sentence += ` ${countryChange.text}.`;
  return sentence;
}

function renderDiffList(diffs) {
  if (!diffs.length) return el("p", { class: "muted" }, STATE.lang === "en" ? "No measurable change." : STATE.lang === "es" ? "Ningún cambio medible." : "Aucun changement mesurable.");
  return el("div", { class: "diff-list" }, diffs.map(d =>
    el("div", { class: "diff-row" }, [
      el("span", { class: "diff-label" }, statLabel(d.label)),
      el("span", { class: "diff-value " + (d.delta > 0 ? "pos" : d.delta < 0 ? "neg" : "") },
        d.text ? d.text : (d.delta > 0 ? `+${d.delta}` : `${d.delta}`)),
    ])
  ));
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k === "disabled") { e.disabled = !!attrs[k]; if (attrs[k]) e.setAttribute("disabled", "true"); }
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild((typeof c === "string" || typeof c === "number") ? document.createTextNode(String(c)) : c);
  });
  return e;
}

// ---------- Boucle de saison, événement par événement ----------

function prepareSeason() {
  const p = STATE.player;
  p.year += 1;
  p.age += 1;
  if (p.yearsInTop === undefined) p.yearsInTop = 0;
  STATE.pendingEvents = seasonEventPool(p);
  STATE.eventIndex = 0;
  STATE.eventChoicesLog = [];
  STATE.screen = "season";
  render();
}

function renderSeason() {
  const p = STATE.player;
  const events = STATE.pendingEvents;
  const idx = STATE.eventIndex;
  const wrap = el("div");

  if (idx >= events.length) {
    finalizeSeason();
    if (STATE.currentSlot) saveToSlot(STATE.currentSlot, p);
    return renderSeasonSummary();
  }

  const ev = localizeEvent(events[idx], p.team);
  const catLabel = ev.category === "match" ? T("matchCat") : ev.category === "personnel" ? T("personalCat") : "⚾";
  const layout = el("div", { class: "action-layout" });
  layout.appendChild(renderScoreboard(p));
  layout.appendChild(el("div", { class: "card" }, [
    el("div", { class: "section-label" }, T("eventCounter", catLabel, idx + 1, events.length, p.year)),
    el("h2", {}, ev.title),
    el("p", { class: "desc" }, ev.text),
    el("div", { class: "choice-list" }, ev.choices.map(choice =>
      el("button", { class: "choice", onclick: () => {
        const before = snapshotPlayer(p);
        choice.apply(p);
        clampStats(p);
        const after = snapshotPlayer(p);
        const diffs = diffPlayer(before, after);
        const diffSum = sumDiffPoints(diffs);
        p.careerPoints = (p.careerPoints || 0) + diffSum;
        let extraFatigue = 0, extraHealthRisk = 0;
        if (ev.weather) { extraFatigue = ev.weather.fatigue; extraHealthRisk = ev.weather.healthRisk; }
        if (extraHealthRisk && Math.random() < 0.3) p.health = clamp(p.health - rnd(1, extraHealthRisk), 0, 100);
        p.fatigue = clamp((p.fatigue || 0) + fatigueFromChoice(Math.abs(diffSum), after.health - before.health) + extraFatigue, 0, 100);
        STATE.eventChoicesLog.push({ title: ev.title, choiceLabel: choice.label, diffs });
        STATE.pendingConsequence = { title: ev.title, choiceLabel: choice.label, diffs, result: choice.result };
        STATE.screen = "consequence";
        render();
      } }, choice.label)
    )),
  ]));
  wrap.appendChild(layout);
  return wrap;
}

function renderConsequence() {

}

function finalizeSeason() {
  const p = STATE.player;
  const c = COUNTRIES[p.country];
  const ov = overall(p);

  if (!p.inTopLeague) {
    const promoChance = clamp(0.22 + ov / 180, 0.22, 0.72);
    if (Math.random() < promoChance) {
      if (p.level < c.minorLevels.length - 1) {
        p.level += 1;
        log(p, `Promu à l'échelon ${c.minorLevels[p.level]}.`);
      } else {
        p.inTopLeague = true;
        log(p, `Appelé en ${c.topLevel} pour la première fois !`);
      }
    }
  } else {
    p.yearsInTop += 1;
  }

  const perf = clamp(ov + rnd(-10, 10) + Math.round((p.morale - 50) / 10) - Math.round((100 - p.health) / 15) - Math.round((p.fatigue || 0) / 12), 1, 99);
  const statLine = generateStatLine(p, perf);
  const seasonLine = { year: p.year, age: p.age, team: p.team, level: p.inTopLeague ? c.topLevel : c.minorLevels[p.level], perf, ov, statLine };
  p.lastSeasonLine = seasonLine;
  if (!p.seasonHistory) p.seasonHistory = [];
  p.seasonHistory.push({ year: p.year, age: p.age, ov, perf, points: p.careerPoints || 0 });
  if (p.inTopLeague) {
    accumulateCareerStats(p, statLine);
    p.leagueStandings = generateStandings(p, perf);
  }
  STATE.newTrophiesThisSeason = [];

  if (p.confidentBet) {
    if (perf >= p.confidentBet.threshold) { p.reputation += rnd(4, 8); log(p, `Ton pari de confiance en interview paie : la saison suit derrière les mots !`); }
    else { p.reputation -= rnd(4, 8); log(p, `Ton pari de confiance en interview se retourne contre toi : la saison ne suit pas.`); }
    p.confidentBet = null;
  }

  const trophyCountBefore = p.trophies.length;
  if (p.inTopLeague) {
    if (perf >= 88 && Math.random() < 0.3) { p.trophies.push(`${c.mvpAward} (${p.year}e saison)`); p.careerPoints += TROPHY_POINTS.mvp; STATE.newTrophiesThisSeason.push(`${c.mvpAward}`); log(p, `Élu ${c.mvpAward} de la ligue !`); p.pendingInterview = { type: "mvp" }; }
    else if (perf >= 80 && Math.random() < 0.5) { p.trophies.push(`Sélection All-Star (${p.year}e saison)`); p.careerPoints += TROPHY_POINTS.allstar; STATE.newTrophiesThisSeason.push("Sélection All-Star"); log(p, `Sélectionné pour le match des étoiles.`); }
    if (p.yearsInTop === 1 && perf >= 68) { p.trophies.push(`${c.rookieAward}`); p.careerPoints += TROPHY_POINTS.rookie; STATE.newTrophiesThisSeason.push(c.rookieAward); log(p, `Élu ${c.rookieAward} !`); }
    const standings = p.leagueStandings || [];
    const teamRank = standings.findIndex((row) => row.team === p.team) + 1;
    if (teamRank === 1) {
      p.trophies.push(`${c.trophy} (${p.year}e saison)`); p.careerPoints += TROPHY_POINTS.championship; p.championshipsWon = (p.championshipsWon || 0) + 1;
      STATE.newTrophiesThisSeason.push(c.trophy);
      log(p, `${p.team} termine 1re du classement et remporte le titre ultime : ${c.trophy} !`);
      p.pendingInterview = { type: "championship" };
    } else if (teamRank > 0) {
      log(p, `${p.team} termine ${teamRank}e du classement de la ligue cette saison — pas de titre cette fois.`);
    }
    const statAwards = checkStatAwards(p, c, statLine, perf);
    STATE.newTrophiesThisSeason.push(...statAwards);
  }
  checkSponsorStatus(p, trophyCountBefore);

  applyAging(p);
  const injury = checkRandomInjury(p);
  if (injury) STATE.injuryThisSeason = injury;
  applyFatigueRecovery(p);
  p.health = clamp(p.health + rnd(2, 8), 40, 100);
  if (p.fanFavorite) p.morale = clamp(p.morale + rnd(3, 6), 0, 100);
  clampStats(p);
  if (p.team) { ensureTeammate(p); ensureClubRival(p); }

  if (p.salary > 0) {
    p.contractYearsLeft = (p.contractYearsLeft || 0) - 1;
    if (p.contractYearsLeft <= 0) renewContract(p);
  }
}

// ---------- Rapport de carrière ----------

function groupTrophies(trophies) {
  const counts = {};
  trophies.forEach(t => {
    const base = t.replace(/\s*\(.*?\)\s*$/, "").trim();
    counts[base] = (counts[base] || 0) + 1;
  });
  return counts;
}

// ---------- Carte de partage de carrière ----------

function drawShareCard(p, report) {
  try {
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1080;
    const ctx = canvas.getContext && canvas.getContext("2d");
    if (!ctx) return null;

  const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
  grad.addColorStop(0, "#0F2C63");
  grad.addColorStop(1, "#081A38");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1080);

  ctx.strokeStyle = "#E63946";
  ctx.lineWidth = 10;
  ctx.strokeRect(30, 30, 1020, 1020);

  ctx.textAlign = "center";
  ctx.fillStyle = "#F4F7FB";
  ctx.font = "bold 46px sans-serif";
  ctx.fillText("HOME RUN LEGACY", 540, 130);

  const c = COUNTRIES[p.country];
  ctx.font = "56px sans-serif";
  ctx.fillText(c.flag || "", 540, 220);

  ctx.font = "bold 64px sans-serif";
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(p.name, 540, 320);

  ctx.font = "36px sans-serif";
  ctx.fillStyle = "#5B8DF6";
  ctx.fillText(`${posName(p.position)} · ${c.league}`, 540, 375);

  ctx.font = "bold 140px sans-serif";
  ctx.fillStyle = "#E63946";
  ctx.fillText(String(report.points), 540, 560);
  ctx.font = "32px sans-serif";
  ctx.fillStyle = "#F4F7FB";
  ctx.fillText(T("careerPoints").toUpperCase(), 540, 610);

  ctx.font = "bold 42px sans-serif";
  ctx.fillStyle = "#F2B134";
  ctx.fillText(tierName(report.tier), 540, 690);

  ctx.font = "30px sans-serif";
  ctx.fillStyle = "#F4F7FB";
  ctx.fillText(`${report.yearsInTop} ${STATE.lang === "en" ? "seasons at the top" : STATE.lang === "es" ? "temporadas en la elite" : "saisons au sommet"}`, 540, 750);
  ctx.fillText(`${report.trophies.length} ${STATE.lang === "en" ? "trophies" : STATE.lang === "es" ? "trofeos" : "trophées"}`, 540, 795);

  if (p.careerStats) {
    const cs = p.careerStats;
    ctx.font = "28px sans-serif";
    ctx.fillStyle = "#5B8DF6";
    const line = p.isPitcher
      ? `${cs.wins}-${cs.losses} · ${cs.bestEra !== null ? cs.bestEra.toFixed(2) : "—"} ERA · ${cs.k} K`
      : `${cs.bestAvg ? cs.bestAvg.toFixed(3).replace(/^0/, "") : "—"} AVG · ${cs.hr} HR · ${cs.rbi} RBI`;
    ctx.fillText(line, 540, 850);
  }

  ctx.font = "24px sans-serif";
  ctx.fillStyle = "rgba(244,247,251,0.6)";
  ctx.fillText("#HomeRunLegacy", 540, 1000);

    return canvas;
  } catch (e) {
    return null; // Canvas indisponible sur ce navigateur : le bouton ne fera simplement rien
  }
}

function shareCareerCard(p, report) {
  const canvas = drawShareCard(p, report);
  if (!canvas || !canvas.toBlob) return;
  try {
    canvas.toBlob((blob) => {
      if (!blob) return;
      const fileName = `home-run-legacy-${(p.name || "career").replace(/\s+/g, "-").toLowerCase()}.png`;
      try {
        if (typeof navigator !== "undefined" && navigator.share && navigator.canShare && typeof File !== "undefined") {
          const file = new File([blob], fileName, { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "Home Run Legacy" }).catch(() => downloadBlob(blob, fileName));
            return;
          }
        }
      } catch (e) { /* repli sur le téléchargement */ }
      downloadBlob(blob, fileName);
    }, "image/png");
  } catch (e) { /* best effort */ }
}

function downloadBlob(blob, fileName) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { /* best effort */ }
}

  const finalFlag = COUNTRIES[c.finalCountry].flag;

  wrap.appendChild(el("div", { class: "intro-hero" }, [
    el("h1", { class: "display" }, T("recap")),
  ]));

  wrap.appendChild(el("div", { class: "scoreboard center" }, [
    el("div", { class: "score-big" }, String(c.points)),
    el("div", { class: "muted" }, T("careerPoints")),
    el("div", { class: "tier-tag", style: "margin-top:6px;" }, tierName(c.tier)),
    el("p", { class: "muted", style: "margin-top:8px;" }, `${POSITION_ICONS[c.position] || ""} ${c.name} · ${posName(c.position)} · ${c.yearsInTop} ${T("seasonsAtTop", c.yearsInTop, "").replace(" ()", "")} · ${startFlag}${c.finalCountry !== c.startCountry ? " → " + finalFlag : ""} · ${T("lastClub")} ${c.finalTeam || "—"}`),
  ]));

  const grouped = groupTrophies(c.trophies || []);
  wrap.appendChild(el("div", { class: "card" }, [
    el("div", { class: "section-label" }, T("trophySummary", (c.trophies || []).length)),
    Object.keys(grouped).length
      ? el("ul", { class: "trophy-list" }, Object.keys(grouped).map(name => el("li", {}, `🏆 ${awardName(name)} ${grouped[name] > 1 ? "× " + grouped[name] : ""}`)))
      : el("p", { class: "muted" }, T("noTrophy")),
  ]));

  if (c.careerStats) {
    const cs = c.careerStats;
    wrap.appendChild(el("div", { class: "card" }, [
      el("div", { class: "section-label" }, T("careerStatsTitle")),
      c.isPitcher
        ? el("div", { class: "diff-list" }, [
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("winLoss")), el("span", { class: "diff-value" }, `${cs.wins}-${cs.losses}`)]),
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("bestEra")), el("span", { class: "diff-value" }, cs.bestEra !== null && cs.bestEra !== undefined ? cs.bestEra.toFixed(2) : "—")]),
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("careerK")), el("span", { class: "diff-value" }, String(cs.k))]),
          ])
        : el("div", { class: "diff-list" }, [
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("bestAvg")), el("span", { class: "diff-value" }, cs.bestAvg ? cs.bestAvg.toFixed(3).replace(/^0/, "") : "—")]),
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("careerHr")), el("span", { class: "diff-value" }, String(cs.hr))]),
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("careerRbi")), el("span", { class: "diff-value" }, String(cs.rbi))]),
            el("div", { class: "diff-row" }, [el("span", { class: "diff-label" }, T("careerSb")), el("span", { class: "diff-value" }, String(cs.sb))]),
          ]),
    ]));
  }

  wrap.appendChild(el("button", { class: "ghost-btn", onclick: () => { STATE.screen = "history"; render(); } }, T("backToHistory")));
  return wrap;
}

function computeCareerRecords(list) {
  const records = [];
  let bestHR = null, bestRBI = null, bestSB = null, bestAvg = null;
  let bestWins = null, bestEra = null, bestK = null, bestPoints = null;
  for (const c of list) {
    if (bestPoints === null || c.points > bestPoints.points) bestPoints = c;
    const cs = c.careerStats;
    if (!cs) continue;
    if (c.isPitcher) {
      if (bestWins === null || cs.wins > bestWins.careerStats.wins) bestWins = c;
      if (cs.bestEra !== null && cs.bestEra !== undefined && (bestEra === null || cs.bestEra < bestEra.careerStats.bestEra)) bestEra = c;
      if (bestK === null || cs.k > bestK.careerStats.k) bestK = c;
    } else {
      if (bestHR === null || cs.hr > bestHR.careerStats.hr) bestHR = c;
      if (bestRBI === null || cs.rbi > bestRBI.careerStats.rbi) bestRBI = c;
      if (bestSB === null || cs.sb > bestSB.careerStats.sb) bestSB = c;
      if (bestAvg === null || cs.bestAvg > bestAvg.careerStats.bestAvg) bestAvg = c;
    }
  }
  if (bestPoints) records.push({ icon: "🏆", label: T("recordPoints"), holder: bestPoints.name, value: String(bestPoints.points) });
  if (bestHR) records.push({ icon: "💥", label: T("recordHR"), holder: bestHR.name, value: String(bestHR.careerStats.hr) });
  if (bestRBI) records.push({ icon: "🎯", label: T("recordRBI"), holder: bestRBI.name, value: String(bestRBI.careerStats.rbi) });
  if (bestSB) records.push({ icon: "⚡", label: T("recordSB"), holder: bestSB.name, value: String(bestSB.careerStats.sb) });
  if (bestAvg) records.push({ icon: "👁️", label: T("recordAVG"), holder: bestAvg.name, value: bestAvg.careerStats.bestAvg.toFixed(3).replace(/^0/, "") });
  if (bestWins) records.push({ icon: "🥎", label: T("recordWins"), holder: bestWins.name, value: String(bestWins.careerStats.wins) });
  if (bestEra) records.push({ icon: "🎯", label: T("recordERA"), holder: bestEra.name, value: bestEra.careerStats.bestEra.toFixed(2) });
  if (bestK) records.push({ icon: "🔥", label: T("recordK"), holder: bestK.name, value: String(bestK.careerStats.k) });
  return records;
}

function renderCareerHistory() {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "intro-hero" }, [el("h1", { class: "display" }, T("historyTitle"))]));

  if (!STATE.historyLoaded) {
    loadCareers().then(list => {
      STATE.careersList = list;
      STATE.historyLoaded = true;
      render();
    });
    wrap.appendChild(el("p", { class: "muted center" }, T("loading")));
  } else {
    const list = STATE.careersList.slice().sort((a, b) => b.points - a.points);
    if (!list.length) {
      wrap.appendChild(el("p", { class: "muted center" }, T("noCareerYet")));
    } else {
      const records = computeCareerRecords(list);
      if (records.length) {
        wrap.appendChild(el("div", { class: "card" }, [
          el("div", { class: "section-label" }, T("recordsSection")),
          el("div", { class: "diff-list" }, records.map(r => el("div", { class: "diff-row" }, [
            el("span", { class: "diff-label" }, `${r.icon} ${r.label} — ${r.holder}`),
            el("span", { class: "diff-value" }, r.value),
          ]))),
        ]));
      }
      const top3 = list.slice(0, 3);
      const rest = list.slice(3);
      wrap.appendChild(el("div", { class: "card" }, [
        el("div", { class: "section-label" }, T("top3")),
        el("div", { class: "history-list" }, top3.map((c, i) => renderCareerRow(c, ["🥇", "🥈", "🥉"][i]))),
      ]));
      if (rest.length) {
        wrap.appendChild(el("div", { class: "card" }, [
          el("div", { class: "section-label" }, T("otherCareers", rest.length)),
          el("div", { class: "history-list" }, rest.map(c => renderCareerRow(c, null))),
        ]));
      }
      wrap.appendChild(el("p", { class: "muted center" }, T("totalCareers", list.length)));
    }
  }

  wrap.appendChild(el("button", { class: "ghost-btn", onclick: () => { STATE.screen = STATE.previousScreen || "home"; render(); } }, T("back")));
  return wrap;
}

// ---------- Scoreboard (élément signature) ----------

function renderScoreboard(p, opts = {}) {
  const c = COUNTRIES[p.country];
  const level = p.inTopLeague ? c.topLevel : c.minorLevels[p.level];
  const SHORT = { fr: { con: "CON", pui: "PUI", vit: "VIT", def: "DEF", ctrl: "CTRL", ad: "AD" }, en: { con: "CON", pui: "PWR", vit: "SPD", def: "DEF", ctrl: "CTL", ad: "FLD" }, es: { con: "CON", pui: "POT", vit: "VEL", def: "DEF", ctrl: "CTL", ad: "CAM" } };
  const sh = SHORT[STATE.lang] || SHORT.fr;
  const statEntries = [
    [STAT_ICONS.contact, sh.con, p.stats.contact], [STAT_ICONS.power, sh.pui, p.stats.power], [STAT_ICONS.speed, sh.vit, p.stats.speed],
    [STAT_ICONS.defense, sh.def, p.stats.defense], [STAT_ICONS.control, p.isPitcher ? sh.ctrl : sh.ad, p.stats.control],
  ];
  const seasonWord = STATE.lang === "en" ? "Season" : STATE.lang === "es" ? "Temporada" : "Saison";
  const preDraftWord = STATE.lang === "en" ? "Pre-draft" : STATE.lang === "es" ? "Predraft" : "Pré-draft";
  const ageWord = STATE.lang === "en" ? "yo" : STATE.lang === "es" ? "años" : "ans";
  return el("div", { class: "scoreboard" }, [
    el("div", { class: "sb-top" }, [
      el("div", { class: "brand-group" }, [
        el("div", { class: "logo-badge", html: logoSvg(30) }),
        el("div", { class: "brand" }, "HOME RUN LEGACY"),
      ]),
      el("div", { class: "meta" }, p.year > 0 ? `${c.flag} ${c.league} · ${seasonWord} ${p.year}` : `${c.flag} ${c.league} · ${preDraftWord}`),
    ]),
    el("div", { class: "player-row" }, [
      el("div", {}, [
        el("div", { class: "player-name" }, p.name),
        el("div", { class: "player-sub" }, `${POSITION_ICONS[p.position] || ""} ${posName(p.position)} · ${p.age} ${ageWord}`),
        p.trait ? (() => {
          const tt = traitText(p.trait);
          const traitIcon = (TRAITS.find(t => t.label === p.trait) || {}).icon || "🎯";
          return el("div", { class: "player-sub trait-tag", title: tt.desc || "" }, [
            el("span", { "aria-hidden": "true" }, `${traitIcon} `), tt.label,
          ]);
        })() : null,
      ]),
      el("div", { style: "text-align:right;" }, [
        opts.hideTeam ? el("span", { class: "badge" }, T("freeAgent")) : el("span", { class: "badge" }, p.team || "—"),
        el("div", { class: "player-sub", style: "margin-top:6px;" }, level),
      ]),
    ]),
    el("div", { class: "stat-grid" }, statEntries.map(([icon, label, val]) => {
      const statColor = val >= 70 ? "var(--stat-high)" : val >= 40 ? "var(--stat-mid)" : "var(--red)";
      return el("div", { class: "stat" }, [
        el("div", { class: "val" }, String(val)),
        el("div", { class: "bar" }, el("div", { style: `width:${val}%; --stat-color:${statColor};` })),
        el("div", { class: "lbl" }, [el("span", { "aria-hidden": "true" }, `${icon} `), label]),
      ]);
    })),
    el("div", { class: "stat-legend" },
      `${STAT_ICONS.contact} ${sh.con} = ${statLabel("Contact")} · ${STAT_ICONS.power} ${sh.pui} = ${statLabel("Puissance")} · ${STAT_ICONS.speed} ${sh.vit} = ${statLabel("Vitesse")} · ${STAT_ICONS.defense} ${sh.def} = ${statLabel("Défense")} · ${STAT_ICONS.control} ${p.isPitcher ? sh.ctrl : sh.ad} = ${p.isPitcher ? statLabel("Contrôle") : T("fieldingLabel")}`
    ),
    el("div", { class: "vitals" }, [
      el("span", { title: `${T("moraleLabel")}: ${p.morale}/100` }, [el("span", { "aria-hidden": "true" }, `${VITAL_ICONS.morale} `), el("b", {}, p.morale)]),
      el("span", { title: `${T("healthLabel")}: ${p.health}/100` }, [el("span", { "aria-hidden": "true" }, `${VITAL_ICONS.health} `), el("b", {}, p.health)]),
      el("span", { title: `${T("reputationLabel")}: ${p.reputation}/100` }, [el("span", { "aria-hidden": "true" }, `${VITAL_ICONS.reputation} `), el("b", {}, p.reputation)]),
      el("span", { title: `${T("scoreLabel")}: ${overall(p)}` }, [el("span", { "aria-hidden": "true" }, "📊 "), el("b", {}, overall(p))]),
    ]),
    el("div", { class: "vitals-legend" },
      `${VITAL_ICONS.morale} ${T("moraleLabel")} · ${VITAL_ICONS.health} ${T("healthLabel")} · ${VITAL_ICONS.reputation} ${T("reputationLabel")} · 📊 ${T("scoreLabel")}`
    ),
    p.salary > 0 ? el("div", { class: "vitals", style: "margin-top:6px;" }, [
      el("span", {}, [`💰 ${c.currency}${formatMoney(p.salary)} ${T("perYear")}`]),
      el("span", {}, [`📄 ${T("contractLabel")} ${p.contractYearsLeft} ${T("contract")}(s)`]),
    ]) : null,
    (p.fatigue || 0) > 0 ? el("div", { class: "vitals", style: "margin-top:6px;" }, [
      el("span", {}, [`😮‍💨 ${T("fatigueLabel")}: `, el("b", {}, p.fatigue || 0)]),
    ]) : null,
    !opts.hideProgressLink ? el("button", { class: "progress-link", onclick: () => {
      STATE.previousScreen = STATE.screen;
      STATE.previousPendingConsequence = STATE.pendingConsequence;
      STATE.screen = "progress";
      render();
    } }, T("progressPanel")) : null,
  ]);
}

render();

// Rattrapage si la langue est stockée via window.storage (hôte) plutôt que localStorage seul.
Store.get("lang").then(v => {
  if ((v === "fr" || v === "en" || v === "es") && v !== STATE.lang) {
    STATE.lang = v;
    render();
  }
}).catch(() => { /* best effort */ });

function setupPWA() {
  try {
    const iconSvg = logoSvg(512).replace(/"/g, "'");
    const iconDataUri = "data:image/svg+xml," + encodeURIComponent(iconSvg);
    const manifest = {
      name: "Home Run Legacy",
      short_name: "HR Legacy",
      start_url: ".",
      display: "standalone",
      background_color: "#081A38",
      theme_color: "#0F2C63",
      icons: [{ src: iconDataUri, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }],
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = manifestUrl;
    if (document.head && document.head.appendChild) document.head.appendChild(link);

    if (typeof navigator !== "undefined" && "serviceWorker" in navigator) {
      const swLines = [
        "const CACHE_NAME = \"home-run-legacy-v1\";",
        "self.addEventListener(\"install\", (e) => { self.skipWaiting(); });",
        "self.addEventListener(\"activate\", (e) => { self.clients.claim(); });",
        "self.addEventListener(\"fetch\", (e) => {",
        "  e.respondWith(",
        "    caches.open(CACHE_NAME).then(async (cache) => {",
        "      const cached = await cache.match(e.request);",
        "      if (cached) return cached;",
        "      try {",
        "        const res = await fetch(e.request);",
        "        cache.put(e.request, res.clone());",
        "        return res;",
        "      } catch (err) {",
        "        return cached || Response.error();",
        "      }",
        "    })",
        "  );",
        "});",
      ];
      const swBlob = new Blob([swLines.join("\n")], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(() => { /* installation best-effort */ });
    }
  } catch (e) { /* PWA best-effort : le jeu reste jouable normalement sans */ }
}

setupPWA();

// ---------- Écran splash (disparaît automatiquement) ----------
try {
  const splashEl = document.getElementById("splash-screen");
  if (splashEl) {
    setTimeout(() => {
      splashEl.classList.add("splash-hide");
      setTimeout(() => { if (splashEl.parentNode) splashEl.parentNode.removeChild(splashEl); }, 800);
    }, 2200);
  }
} catch (e) { /* best effort : le jeu reste jouable sans splash */ }


</script>
