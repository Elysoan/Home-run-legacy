ext": "Una relación seria empieza a ocupar un lugar importante en tu vida.", "labels": ["Comprometerte a fondo con la relación", "Priorizar tu carrera por ahora"], "results": ["Te comprometes a fondo con esta relación que empieza.", "Priorizas tu carrera, por ahora."]}}, "investment": {"en": {"title": "Investment proposal", "text": "A friend proposes putting money into a risky project.", "labels": ["Invest, take the chance", "Stay cautious, decline"], "results": ["You put money into the risky project your friend proposed.", "You stay cautious and keep your savings tucked away."]}, "es": {"title": "Propuesta de inversión", "text": "Un allegado te propone invertir en un proyecto arriesgado.", "labels": ["Invertir, arriesgarte", "Ser prudente, rechazar"], "results": ["Inviertes dinero en el proyecto arriesgado que te propuso tu amigo.", "Te mantienes prudente y guardas tus ahorros."]}}, "flu": {"en": {"title": "Nasty cold before a key game", "text": "You're feeling feverish and weak just days before an important game.", "labels": ["Play through it, grit your teeth", "Rest up and let it pass"], "results": ["You play through the fever, gritting your teeth until the final out.", "You rest up and let the virus pass before coming back."]}, "es": {"title": "Fuerte resfriado antes de un partido clave", "text": "Te sientes febril y débil a pocos días de un partido importante.", "labels": ["Jugar de todas formas, apretar los dientes", "Descansar y dejar que pase"], "results": ["Juegas con fiebre, apretando los dientes hasta el último out.", "Descansas y dejas pasar el virus antes de volver."]}}, "hometown_visit": {"en": {"title": "Trip back to your hometown", "text": "Back home for a visit, everyone wants to see you.", "labels": ["Enjoy the quiet time with family", "Make more public appearances"], "results": ["You enjoy a real moment of peace with family, away from the noise.", "You make the rounds during your time back home."]}, "es": {"title": "Regreso a tu ciudad natal", "text": "De vuelta en casa, todo el mundo quiere verte.", "labels": ["Disfrutar la calma en familia", "Multiplicar las apariciones públicas"], "results": ["Disfrutas un verdadero momento de calma en familia, lejos del ruido.", "Multiplicas las apariciones públicas durante tu estancia en casa."]}}, "viral_post": {"en": {"title": "Post goes viral", "text": "A photo or video of you is going viral on social media.", "labels": ["Own it and ride the wave", "Stay quiet, let it blow over"], "results": ["You own the buzz and ride the wave of media appearances that follow.", "You stay quiet, letting the media storm burn itself out."]}, "es": {"title": "Publicación se vuelve viral", "text": "Una foto o video tuyo se difunde masivamente en redes sociales.", "labels": ["Asumirlo y aprovechar el momento", "Mantenerte discreto, dejar que pase"], "results": ["Asumes la ola y encadenas las apariciones mediáticas que siguen.", "Te mantienes discreto, dejando que la tormenta mediática se apague sola."]}}, "childhood_friend": {"en": {"title": "Childhood friend needs help", "text": "A longtime friend asks you for a financial favor.", "labels": ["Help without hesitation", "Politely decline"], "results": ["You help your childhood friend without a second thought.", "You politely decline, keeping your distance on this one."]}, "es": {"title": "Un amigo de la infancia necesita ayuda", "text": "Un amigo de toda la vida te pide un favor económico.", "labels": ["Ayudarlo sin dudar", "Rechazar amablemente"], "results": ["Ayudas a tu amigo de la infancia sin pensarlo dos veces.", "Rechazas amablemente, manteniendo las distancias en este tema."]}}, "walkoff": {"en": {"title": "Chance for a walk-off hit", "text": "Two outs. Runners shifting on the bases. The stadium is on its feet, silent for a second... then erupts. Everything comes down to your next at-bat!", "labels": ["Go for the big swing", "Just make simple contact"], "results": ["You grit your teeth, aim for the stands — and send the ball flying as the crowd roars!", "You stay calm, poke the ball up the middle: a single is enough, and the crowd erupts with joy!"]}, "es": {"title": "Ocasión de jugada ganadora", "text": "Dos outs. Los corredores se mueven en las bases. El estadio está de pie, en silencio un instante... y estalla. ¡Todo se decide en tu próximo turno al bate!", "labels": ["Ir a por el batazo grande", "Asegurar el contacto simple"], "results": ["Aprietas los dientes, apuntas a las gradas — ¡y mandas la bola volando entre el rugido del estadio!", "Te mantienes tranquilo, colocas la bola al centro: un sencillo basta, ¡y la afición estalla de alegría!"]}}, "elimination_game": {"en": {"title": "Elimination game", "text": "One loss and it's over. The season, the effort, all of it ends right there. You feel your heart pound harder than usual as you step onto the field.", "labels": ["Play with desperate energy", "Stay in your bubble, manage your emotions"], "results": ["You play with fire in your belly, refusing to let the season end on one knee.", "You breathe, refocus, and approach this crucial game with an almost eerie calm."]}, "es": {"title": "Partido de eliminación directa", "text": "Una derrota y se acaba todo. La temporada, el esfuerzo, todo termina ahí. Sientes el corazón latir más fuerte de lo habitual al pisar el terreno.", "labels": ["Jugar con la energía de la desesperación", "Mantener la calma, gestionar tus emociones"], "results": ["Juegas con rabia en el cuerpo, negándote a que la temporada acabe de rodillas.", "Respiras, te centras y afrontas este partido decisivo con una calma casi inquietante."]}}, "national_team": {"en": {"title": "Called up to the national team", "text": "The phone rings. On the other end, the national team manager. Your country wants you wearing its colors on the world stage!", "labels": ["Answer the call with pride", "Decline to protect your body"], "results": ["You answer yes without hesitation, proud to wear your country's colors on the world stage!", "You decline, heartbroken, to protect your body for the long run."]}, "es": {"title": "Convocatoria a la selección nacional", "text": "Suena el teléfono. Al otro lado, el seleccionador nacional. ¡Tu país quiere verte vistiendo sus colores en el escenario mundial!", "labels": ["Responder con orgullo", "Rechazar para cuidar tu cuerpo"], "results": ["Respondes que sí sin dudar, orgulloso de vestir los colores de tu país en la escena mundial!", "Rechazas, con el corazón roto, para cuidar tu cuerpo a largo plazo."]}}, "brawl": {"en": {"title": "Bench-clearing brawl", "text": "The pitch sails inside — way too close! The batter throws his bat, both benches clear in an instant. Chaos takes over the field.", "labels": ["Step in to calm things down", "Stay back, avoid trouble"], "results": ["You throw yourself into the brawl to separate the combatants before it gets any worse.", "You stay back, away from the flying fists, letting others settle their scores."]}, "es": {"title": "Bronca general en el terreno", "text": "¡El lanzamiento se va adentro, demasiado cerca! El bateador tira el bate, ambos bancos se vacían al instante. El caos se apodera del terreno.", "labels": ["Intervenir para calmar las cosas", "Mantenerte al margen"], "results": ["Te lanzas a la bronca para separar a los implicados antes de que vaya a más.", "Te mantienes al margen, lejos de los puñetazos, dejando que otros arreglen sus cuentas."]}}, "no_hitter": {"en": {"title": "Three outs from a perfect game", "text": "Three outs. Three more outs and your name enters the history books. The stadium holds its breath on every pitch, every swing and miss triggers a roar.", "labels": ["Push through to the end", "Leave it to the bullpen out of caution"], "results": ["You climb the mound one last time, heart pounding, ready to make history or lose it all.", "Heavy-hearted, you hand the ball to the bullpen — caution wins out over the dream."]}, "es": {"title": "A tres outs de un juego perfecto", "text": "Tres outs. Tres outs más y tu nombre entra en la historia. El estadio contiene la respiración en cada lanzamiento, cada swing fallido desata un rugido.", "labels": ["Seguir hasta el final", "Ceder el turno al bullpen por precaución"], "results": ["Subes al montículo una última vez, con el corazón acelerado, listo para hacer historia o perderlo todo.", "Con el corazón encogido, entregas la bola al bullpen — la prudencia gana al sueño."]}}, "ejection": {"en": {"title": "Controversial ejection", "text": "The umpire points, ejects your teammate with no appeal possible. The dugout is already boiling with anger behind you.", "labels": ["Charge in to defend him", "Stay professional, let it play out"], "results": ["You charge at the umpire, raise your voice, and defend your teammate with everything you've got.", "You clench your fists but hold back, professional to the end."]}, "es": {"title": "Expulsión polémica", "text": "El árbitro señala y expulsa a tu compañero sin posibilidad de apelación. El banquillo ya hierve de rabia detrás de ti.", "labels": ["Salir a defenderlo", "Mantenerte profesional, dejar que siga su curso"], "results": ["Te lanzas hacia el árbitro, alzas la voz y defiendes a tu compañero con todo lo que tienes.", "Aprietas los puños pero te contienes, profesional hasta el final."]}}, "extra_innings": {"en": {"title": "Endless extra-innings marathon", "text": "Tenth inning. Eleventh. Bodies are running on empty, night falls over the stadium, and nobody wants to give in first.", "labels": ["Dig deep into your reserves", "Raise your hand, ask to come out"], "results": ["You dig into your very last reserves, refusing to give up an inch of ground.", "Exhausted, you raise your hand toward the dugout: it's the bullpen's turn to take over."]}, "es": {"title": "Maratón interminable de entradas extra", "text": "Décima entrada. Undécima. Los cuerpos están al límite, cae la noche sobre el estadio y nadie quiere ceder primero.", "labels": ["Sacar fuerzas de donde no hay", "Pedir salir del partido"], "results": ["Sacas fuerzas hasta de donde no hay, negándote a ceder un centímetro de terreno.", "Agotado, levantas la mano hacia el banquillo: le toca al bullpen tomar el relevo."]}}, "rival_duel": {"en": {"title": "Highly anticipated individual duel", "text": "The stadium holds its breath: you, face to face with the other team's biggest star. This duel, everyone will be talking about it tomorrow.", "labels": ["Provoke the duel, play with swagger", "Play as a team, avoid the ego trap"], "results": ["You look him dead in the eye and accept the duel — may the best man win, in front of the entire stadium!", "You resist the temptation of the ego and play for the team, leaving the individual duel aside."]}, "es": {"title": "Duelo individual muy esperado", "text": "El estadio contiene la respiración: tú, cara a cara con la gran estrella del equipo rival. De este duelo hablará todo el mundo mañana.", "labels": ["Provocar el duelo, jugar con osadía", "Jugar en equipo, evitar la trampa del ego"], "results": ["Lo miras fijamente y aceptas el duelo — ¡que gane el mejor, ante todo el estadio!", "Resistes la tentación del ego y juegas para el equipo, dejando de lado el duelo individual."]}}, "rookie_hazing": {"en": {"title": "Rookie hazing ritual", "text": "The veterans are planning a prank on one of the young players.", "labels": ["Play along good-naturedly", "Politely refuse"], "results": ["You play along good-naturedly, to the veterans' delight.", "You politely refuse to go along with it."]}, "es": {"title": "Rito de iniciación para novatos", "text": "Los veteranos preparan una broma para uno de los jugadores jóvenes.", "labels": ["Seguirles el juego de buen humor", "Negarte amablemente"], "results": ["Sigues el juego de buen humor, para deleite de los veteranos.", "Rechazas amablemente participar."]}}, "salary_arbitration": {"en": {"title": "Salary arbitration hearing", "text": "A financial disagreement with the {team} needs to be settled.", "labels": ["Fight for your market value", "Find a quick compromise"], "results": ["You grind hard to prove your true worth on the market.", "You accept a quick compromise to move on."]}, "es": {"title": "Proceso de arbitraje salarial", "text": "Un desacuerdo económico con los {team} debe resolverse.", "labels": ["Luchar por tu valor de mercado", "Buscar un acuerdo rápido"], "results": ["Peleas con fuerza para demostrar tu verdadero valor en el mercado.", "Aceptas un acuerdo rápido para pasar página."]}}, "front_office_meeting": {"en": {"title": "Meeting with the front office", "text": "The front office wants to discuss your role in the team's long-term plans.", "labels": ["Ask for more responsibility", "Stay in your role, prove yourself on the field"], "results": ["You ask the front office for more responsibility.", "You stay in your role and let the field speak for you."]}, "es": {"title": "Reunión con la directiva deportiva", "text": "La directiva quiere hablar de tu papel en el proyecto a largo plazo del equipo.", "labels": ["Pedir más responsabilidad", "Mantenerte en tu rol, demostrarlo en el terreno"], "results": ["Pides a la directiva más responsabilidad.", "Te mantienes en tu papel y dejas que el terreno hable por ti."]}}, "equipment_change": {"en": {"title": "New equipment deal", "text": "An equipment maker offers to change your bat or glove for payment.", "labels": ["Accept, adapt to the new gear", "Stay loyal to your usual gear"], "results": ["You adopt the new gear, even if it means getting used to it.", "You stay loyal to your usual gear."]}, "es": {"title": "Nuevo contrato de equipamiento", "text": "Una marca te propone cambiar tu bate o guante a cambio de un pago.", "labels": ["Aceptar, adaptarte al nuevo equipo", "Mantenerte fiel a tu equipo habitual"], "results": ["Adoptas el nuevo equipo, aunque tengas que acostumbrarte.", "Te mantienes fiel a tu equipo habitual."]}}, "podcast_invite": {"en": {"title": "Invitation to a sports podcast", "text": "A popular podcast wants to interview you in depth.", "labels": ["Accept, open up honestly", "Decline, protect your privacy"], "results": ["You open up honestly at the mic, no filter.", "You decline to protect your privacy."]}, "es": {"title": "Invitación a un pódcast deportivo", "text": "Un pódcast popular quiere entrevistarte en profundidad.", "labels": ["Aceptar, sincerarte", "Rechazar, proteger tu privacidad"], "results": ["Te sinceras ante el micrófono, sin filtros.", "Rechazas para proteger tu privacidad."]}}, "statline_milestone": {"en": {"title": "Approaching a statistical milestone", "text": "You're approaching a symbolic milestone in your career.", "labels": ["Focus everything on reaching it", "Don't think about it, play as usual"], "results": ["You focus everything on reaching this symbolic milestone.", "You play it normal, without thinking about the number that's approaching."]}, "es": {"title": "Cerca de una marca estadística", "text": "Te acercas a una marca simbólica en tu carrera.", "labels": ["Concentrarte a fondo en alcanzarla", "No pensar en ello, jugar con normalidad"], "results": ["Concentras todo tu esfuerzo en alcanzar esta marca simbólica.", "Juegas con normalidad, sin pensar en la cifra que se acerca."]}}, "hit_by_pitch": {"en": {"title": "Hit by an inside pitch", "text": "The pitch tails in, hits you square in mid-stride! Pain shoots through you, the stadium holds its breath for a second.", "labels": ["Get up and jog to first without flinching", "Ask for a medical evaluation"], "results": ["You wince, bounce right back up, and jog to first without a backward glance.", "You stay down for a moment while the medical staff rushes over to check on you."]}, "es": {"title": "Golpeado por un lanzamiento interior", "text": "¡El lanzamiento se cierra y te golpea en plena carrera! El dolor te recorre, el estadio contiene la respiración un instante.", "labels": ["Levantarte y avanzar sin inmutarte", "Pedir una evaluación médica"], "results": ["Haces una mueca, te levantas de un salto y avanzas a primera sin mirar atrás.", "Te quedas en el suelo un instante mientras el personal médico corre a revisarte."]}}, "stolen_base_attempt": {"en": {"title": "Game-changing stolen base attempt", "text": "The pitcher barely glances your way. Now or never: a golden chance to steal this base and flip the game!", "labels": ["Attempt the steal", "Stay put on the base"], "results": ["You take off at the signal, heart pounding — and dive headfirst toward the base to the roar of the crowd!", "You stay safely put on the base, refusing to tempt fate."]}, "es": {"title": "Intento decisivo de base robada", "text": "El lanzador apenas te mira. Ahora o nunca: ¡una ocasión de oro para robar esta base y cambiar el partido!", "labels": ["Intentar el robo", "Quedarte quieto en la base"], "results": ["Sales al ataque con el corazón acelerado — ¡y te lanzas de cabeza hacia la base entre los gritos del estadio!", "Te quedas prudentemente en la base, sin tentar a la suerte."]}}, "double_play_pressure": {"en": {"title": "Double play needed under pressure", "text": "The ball rolls on the ground, fast and dangerous. One shot to escape this inning through the front door.", "labels": ["Take the risk of the spectacular play", "Secure the simple play"], "results": ["You dive, pivot, and throw in one motion — a spectacular play that electrifies the stadium!", "You play it simple and safe, one out in the books, no unnecessary risk."]}, "es": {"title": "Doble play necesario bajo presión", "text": "La bola rueda por el suelo, rápida y peligrosa. Una sola oportunidad de salir de esta entrada por la puerta grande.", "labels": ["Arriesgar la jugada espectacular", "Asegurar la jugada simple"], "results": ["Te lanzas, giras y lanzas en un solo movimiento — ¡una jugada espectacular que electriza el estadio!", "Juegas simple y seguro, un out asegurado, sin riesgo innecesario."]}}, "rain_delay": {"en": {"title": "Rain delay in a crucial game", "text": "The storm breaks suddenly, rain pours onto the field in the middle of a crucial game. Everything stops, abruptly.", "labels": ["Stay focused through the wait", "Ease off, lose the flow of the game"], "results": ["Under the shelter, you stay focused, replaying every situation in your head while waiting for the restart.", "The wait drags on and your rhythm suffers: hard to get back into the game afterward."]}, "es": {"title": "Suspensión por lluvia en un partido clave", "text": "La tormenta estalla de repente, la lluvia cae sobre el terreno en plena dinámica del partido. Todo se detiene, de golpe.", "labels": ["Mantener la concentración durante la espera", "Relajarte, perder el ritmo del partido"], "results": ["Bajo el refugio, te mantienes concentrado, repasando cada jugada en tu cabeza mientras esperas la reanudación.", "La espera se alarga y tu ritmo se resiente: cuesta retomar el partido después."]}}, "doubleheader": {"en": {"title": "Doubleheader: two games, one day", "text": "Two games, one single day. The sun is already blazing when the first pitch of the doubleheader is thrown.", "labels": ["Give everything across both games", "Manage your effort over the day"], "results": ["You attack the second game with the same intensity as the first, without saving a single ounce of energy.", "You manage your effort wisely to go the distance over the full day."]}, "es": {"title": "Doble cartelera: dos partidos, un día", "text": "Dos partidos, un solo día. El sol ya aprieta cuando se lanza el primer pitch de la doble cartelera.", "labels": ["Darlo todo en ambos partidos", "Administrar tu esfuerzo durante el día"], "results": ["Afrontas el segundo partido con la misma intensidad que el primero, sin ahorrar energía.", "Administras tu esfuerzo con inteligencia para aguantar toda la jornada."]}}, "playoff_opener": {"en": {"title": "First playoff game", "text": "The stadium is packed to the rafters. Flags snap, the crowd roars. The first playoff game starts now — and nothing will ever be the same.", "labels": ["Feed off the pressure", "Refocus on the fundamentals"], "results": ["You feed off the pressure of the packed stadium, every roar from the crowd pushing you further!", "You block out the noise of the crowd and refocus on the fundamentals that got you here."]}, "es": {"title": "Primer partido de series eliminatorias", "text": "El estadio está a reventar. Las banderas ondean, la multitud ruge. El primer partido de series empieza ahora — y nada volverá a ser igual.", "labels": ["Alimentarte de la presión", "Volver a los fundamentos"], "results": ["Te alimentas de la presión del estadio lleno, cada rugido de la afición te empuja más lejos!", "Bloqueas el ruido de la grada y vuelves a los fundamentos que te trajeron hasta aquí."]}}, "mental_break": {"en": {"title": "Need to ease off the gas", "text": "The pressure is piling up and you feel like you need to breathe for a moment.", "labels": ["Take a real break", "Keep pushing despite the fatigue"], "results": ["You finally give yourself a real break, away from the stadium.", "You keep pushing despite the fatigue piling up."]}, "es": {"title": "Necesidad de bajar el ritmo", "text": "La presión se acumula y sientes que necesitas respirar un poco.", "labels": ["Tomarte un descanso de verdad", "Seguir presionando pese al cansancio"], "results": ["Por fin te concedes un descanso de verdad, lejos del estadio.", "Sigues presionando pese al cansancio acumulado."]}}, "old_teammate_reunion": {"en": {"title": "Reunion with a former teammate", "text": "A former teammate, now a rival, comes to see you before the game.", "labels": ["Take time to catch up", "Stay focused on the competition"], "results": ["You take time to reconnect with a former teammate turned rival.", "You stay focused on the competition, refusing to be distracted."]}, "es": {"title": "Reencuentro con un excompañero", "text": "Un excompañero, ahora rival, viene a verte antes del partido.", "labels": ["Tomarte un tiempo para reencontrarte", "Mantenerte enfocado en la competición"], "results": ["Te tomas un tiempo para reencontrarte con un excompañero convertido en rival.", "Te mantienes enfocado en la competición, sin dejarte distraer."]}}, "foundation_launch": {"en": {"title": "Launching your own foundation", "text": "You get the chance to launch a charitable foundation under your name.", "labels": ["Launch the project", "Push the project back to later"], "results": ["You launch your own foundation.", "You push the project back to focus on the game."]}, "es": {"title": "Lanzamiento de tu propia fundación", "text": "Tienes la oportunidad de lanzar una fundación benéfica con tu nombre.", "labels": ["Lanzar el proyecto", "Posponer el proyecto"], "results": ["Lanzas tu propia fundación.", "Pospones el proyecto para centrarte en el juego."]}}, "training_camp_abroad": {"en": {"title": "Training camp abroad", "text": "The off-season gives you a chance to train at a renowned facility abroad.", "labels": ["Go train abroad", "Stay and train close to home"], "results": ["You head abroad to sharpen your skills at a renowned facility.", "You stay and train close to home, in a familiar setting."]}, "es": {"title": "Campamento de entrenamiento en el extranjero", "text": "La pretemporada te da la oportunidad de entrenar en un centro de renombre en el extranjero.", "labels": ["Ir a perfeccionarte al extranjero", "Quedarte a entrenar cerca de casa"], "results": ["Te vas al extranjero a perfeccionarte en un centro de renombre.", "Te quedas a entrenar cerca de casa, en un entorno familiar."]}}, "blown_save": {"en": {"title": "Lead to protect late in the game", "text": "A slim lead, a stadium on its feet, everything riding on this final pitch. One mistake and it all falls apart.", "labels": ["Attack the zone with your best pitch", "Play it safe, avoid the big mistake"], "results": ["You attack the zone without backing down, your best pitch in hand, ready to risk it all for this lead!", "You play it cautious, avoiding the head-on duel to keep from exposing yourself to the big hit."]}, "es": {"title": "Ventaja que proteger al final del partido", "text": "Una ventaja mínima, un estadio de pie, todo depende de este último lanzamiento. Un error y todo se derrumba.", "labels": ["Atacar la zona con tu mejor lanzamiento", "Jugar con cautela, evitar el gran error"], "results": ["Atacas la zona sin retroceder, con tu mejor lanzamiento, ¡listo para arriesgarlo todo por esta ventaja!", "Juegas con cautela, evitando el duelo frontal para no exponerte al batazo grande."]}}, "mound_visit": {"en": {"title": "Visit from the coach to the mound", "text": "The coach crosses the field slowly, his face grim. He's coming to the mound after a rough string of pitches.", "labels": ["Reassure him, ask to stay in the game", "Accept ceding the ball to the bullpen"], "results": ["You look the coach dead in the eye and convince him to let you finish what you started.", "You nod, resigned, and hand the ball to the bullpen taking over."]}, "es": {"title": "Visita del entrenador al montículo", "text": "El entrenador cruza el terreno con paso lento, el rostro serio. Sube al montículo tras una racha de lanzamientos difíciles.", "labels": ["Tranquilizarlo, pedir seguir en el partido", "Aceptar ceder la bola al bullpen"], "results": ["Miras al entrenador fijamente y lo convences de dejarte terminar lo que empezaste.", "Asientes, resignado, y entregas la bola al bullpen que toma el relevo."]}}, "game_calling": {"en": {"title": "Calling the pitch sequence", "text": "The best hitter on the other team steps into the box. It's on you to decide what pitch he's about to see.", "labels": ["Bet on daring, surprise the hitter", "Play the classic, safe sequence"], "results": ["You bet on daring with an unexpected sequence that completely surprises the hitter!", "You play the safe card with a classic, proven sequence."]}, "es": {"title": "Elección de la secuencia de lanzamientos", "text": "El mejor bateador rival entra a la caja. Depende de ti decidir qué lanzamiento va a ver.", "labels": ["Apostar por la osadía, sorprender al bateador", "Jugar la secuencia clásica y segura"], "results": ["Apuestas por la osadía con una secuencia inesperada que sorprende por completo al bateador!", "Juegas la carta segura con una secuencia clásica y probada."]}}, "blocking_the_plate": {"en": {"title": "Collision at the plate", "text": "The runner charges, head down, toward the plate. The ball arrives at the same instant. A collision is unavoidable in a split second.", "labels": ["Block the plate no matter what", "Get out of the way to avoid the collision"], "results": ["You plant yourself in front of the plate, take the hit head-on, but the ball stays in your glove!", "You get out of the way at the last instant, dodging the head-on collision."]}, "es": {"title": "Colisión en el plato", "text": "El corredor se lanza, cabeza baja, hacia el plato. La bola llega en el mismo instante. La colisión es inevitable en una fracción de segundo.", "labels": ["Bloquear el plato a toda costa", "Apartarte para evitar el choque"], "results": ["Te plantas frente al plato, encajas el golpe de lleno, ¡pero la bola se queda en tu guante!", "Te apartas en el último instante, esquivando la colisión frontal."]}}, "pickoff_throw": {"en": {"title": "Attempted pickoff at second base", "text": "The opposing runner strays from the base, a little too confident. The perfect pickoff chance is here, right now.", "labels": ["Take the risk of the spectacular play", "Hold the ball, don't take a risk"], "results": ["You spin and fire like lightning toward second base — the stadium holds its breath!", "You hold onto the ball, refusing to take the slightest risk."]}, "es": {"title": "Intento de pickoff en segunda base", "text": "El corredor rival se aleja de la base, un poco demasiado confiado. La ocasión perfecta de un out está aquí, ahora mismo.", "labels": ["Arriesgar el lanzamiento decisivo", "Guardar la bola, no arriesgar"], "results": ["Giras y lanzas como un rayo hacia segunda base — ¡el estadio contiene la respiración!", "Te guardas la bola, sin arriesgar lo más mínimo."]}}, "diving_catch": {"en": {"title": "Chance for a spectacular diving catch", "text": "The ball escapes toward left field, just out of reach... or almost. One chance to dive and grab it.", "labels": ["Dive for the spectacular catch", "Play it safe, cut off the ball's path"], "results": ["You launch yourself, body horizontal, and the ball lands in your outstretched glove just off the ground — the stadium explodes!", "You play it safe, cutting off the ball's path without taking unnecessary risks."]}, "es": {"title": "Ocasión de atrapada espectacular", "text": "La bola se escapa hacia el jardín izquierdo, fuera de alcance... o casi. Una sola oportunidad de lanzarte a por ella.", "labels": ["Lanzarte por la atrapada espectacular", "Jugar con cautela, cortar la trayectoria"], "results": ["Te lanzas, cuerpo horizontal, y la bola cae en tu guante extendido a ras de suelo — ¡el estadio estalla!", "Juegas con cautela, cortando simplemente la trayectoria sin arriesgar de más."]}}, "relay_throw": {"en": {"title": "Decisive relay throw from the outfield", "text": "The runner is sprinting for the plate at full speed. One perfect relay throw, and only one, can still stop him.", "labels": ["Take the risk of the perfect throw", "Secure the throw to a closer base"], "results": ["The relay is perfect, the ball snaps into the catcher's mitt just ahead of the runner — spectacular out!", "You secure your throw to a closer base, without trying the perfect play."]}, "es": {"title": "Relevo decisivo desde el jardín", "text": "El corredor corre a toda velocidad hacia el plato. Solo un relevo perfecto puede detenerlo.", "labels": ["Arriesgar el lanzamiento perfecto", "Asegurar el lanzamiento a una base más cercana"], "results": ["El relevo sale perfecto, la bola llega al guante del receptor justo antes que el corredor — ¡out espectacular!", "Aseguras tu lanzamiento a una base más cercana, sin intentar la jugada perfecta."]}}, "double_play_turn": {"en": {"title": "Double play to turn under pressure", "text": "The ball rockets across the infield. A double play is within reach — if the execution is perfect.", "labels": ["Attempt the perfect technical play", "Secure at least a simple out"], "results": ["The motion is fluid, precise, surgical: double play turned in the blink of an eye to applause!", "You secure a simple, solid, unspectacular out."]}, "es": {"title": "Doble play que ejecutar bajo presión", "text": "La bola vuela por el cuadro interior. Un doble play está al alcance — si la ejecución es perfecta.", "labels": ["Intentar la jugada técnica perfecta", "Asegurar al menos un out simple"], "results": ["El gesto es fluido, preciso, quirúrgico: doble play resuelto en un abrir y cerrar de ojos entre aplausos!", "Aseguras un out simple, sólido, sin brillo pero efectivo."]}}, "clubhouse_prank": {"en": {"title": "Locker room prank", "text": "The veterans are cooking up a prank targeting a young teammate.", "labels": ["Take the young player's side", "Join in on the prank"], "results": ["You stand up for the rookie being targeted and calm things down before they escalate.", "You go along with the veterans' prank, even at the new guy's expense."]}, "es": {"title": "Broma en el vestuario", "text": "Los veteranos preparan una broma dirigida a un compañero joven.", "labels": ["Defender al joven", "Participar en la broma"], "results": ["Defiendes al novato señalado y calmas las cosas antes de que vayan a más.", "Sigues la broma de los veteranos, aunque sea a costa del nuevo."]}}, "agent_pressure": {"en": {"title": "Your agent wants more visibility", "text": "Your agent is pushing you to accept more public appearances and sponsors.", "labels": ["Follow your agent's advice", "Refocus the conversation on the field"], "results": ["You pile on the commitments on your agent's advice, at the cost of your free time.", "You refocus the conversation: the field comes first, everything else after."]}, "es": {"title": "Tu agente quiere más visibilidad", "text": "Tu agente insiste en que aceptes más apariciones públicas y patrocinadores.", "labels": ["Seguir el consejo de tu agente", "Reenfocar la conversación en el terreno"], "results": ["Aceptas más compromisos siguiendo el consejo de tu agente, a costa de tu tiempo libre.", "Reenfocas la conversación: el terreno primero, lo demás después."]}}, "uniform_number": {"en": {"title": "Choosing a signature number", "text": "A legendary club number has just opened up.", "labels": ["Claim it, embrace the symbolic pressure", "Keep a lower-profile number"], "results": ["You claim the legendary number, ready to carry what it represents.", "You'd rather stay low-key and keep a number with no history attached."]}, "es": {"title": "Elección de un número emblemático", "text": "Un número mítico del club acaba de quedar libre.", "labels": ["Reclamarlo, asumir la presión simbólica", "Mantener un número más discreto"], "results": ["Reclamas el número legendario, listo para asumir lo que representa.", "Prefieres mantener el perfil bajo con un número sin historia."]}}, "language_barrier": {"en": {"title": "Language barrier", "text": "In this new country, communication with some teammates is still difficult.", "labels": ["Take intensive language lessons", "Rely on gestures and an interpreter"], "results": ["You throw yourself into learning the local language, to the delight of the clubhouse.", "You get by with gestures and occasional help from an interpreter."]}, "es": {"title": "Barrera del idioma", "text": "En este nuevo país, la comunicación con algunos compañeros sigue siendo difícil.", "labels": ["Tomar clases intensivas de idioma", "Apoyarte en gestos y un intérprete"], "results": ["Te lanzas a aprender el idioma local, para deleite del vestuario.", "Te las arreglas con gestos y la ayuda puntual de un intérprete."]}}, "post_game_media_storm": {"en": {"title": "Media storm after a costly error", "text": "The next day, your mistake is the headline. Criticism pours in, microphones are shoved in your face the moment you arrive at the ballpark.", "labels": ["Respond publicly, own the mistake", "Let the silence do the work"], "results": ["You face the cameras head-on and own your mistake in front of everyone, head held high.", "You stay quiet, letting the media storm burn itself out."]}, "es": {"title": "Tormenta mediática tras un error decisivo", "text": "Al día siguiente, tu error es la noticia. Llueven las críticas, los micrófonos te esperan nada más llegar al estadio.", "labels": ["Responder públicamente, asumir el error", "Dejar que el silencio haga su trabajo"], "results": ["Afrontas las cámaras sin rodeos y asumes tu error ante todos, con la cabeza alta.", "Guardas silencio, dejando que la tormenta mediática se apague sola."]}}, "curfew_violation": {"en": {"title": "Curfew violation", "text": "You get home well past the team's curfew before a game.", "labels": ["Own up to it in front of the coach", "Hope it goes unnoticed"], "results": ["You own up to your lateness directly with the coach, no excuses.", "You hope the incident goes unnoticed and get back to your normal routine."]}, "es": {"title": "Toque de queda incumplido", "text": "Llegas mucho después del toque de queda del equipo antes de un partido.", "labels": ["Asumirlo ante el entrenador", "Esperar que pase desapercibido"], "results": ["Asumes tu retraso directamente ante el entrenador, sin excusas.", "Esperas que el incidente pase desapercibido y retomas tu rutina normal."]}}, "sibling_rivalry": {"en": {"title": "A sibling in the same sport", "text": "A family member is also in the world of baseball, and the comparisons keep coming.", "labels": ["Turn the rivalry into positive fuel", "Distance yourself from the topic"], "results": ["You turn this family rivalry into fuel to keep improving.", "You prefer to keep your distance on this sensitive subject."]}, "es": {"title": "Un hermano o hermana en el mismo deporte", "text": "Un familiar también está en el mundo del béisbol, y las comparaciones no paran.", "labels": ["Convertir la rivalidad en motivación positiva", "Tomar distancia del tema"], "results": ["Conviertes esta rivalidad familiar en combustible para seguir mejorando.", "Prefieres mantener las distancias con este tema sensible."]}}, "retirement_whispers": {"en": {"title": "Retirement rumors", "text": "Rumors are swirling about a possible retirement.", "labels": ["Wave the rumors off with a shrug", "Start thinking about it seriously"], "results": ["You wave off the rumors and remind everyone you're still hungry for competition.", "You quietly begin to seriously consider life after baseball."]}, "es": {"title": "Rumores de retiro", "text": "Circulan rumores sobre un posible final de carrera.", "labels": ["Descartar los rumores sin más", "Empezar a pensarlo en serio"], "results": ["Descartas los rumores y recuerdas que sigues hambriento de competición.", "Empiezas, en silencio, a plantearte en serio la vida después del béisbol."]}}, "bunt_situation": {"en": {"title": "Sacrifice bunt situation", "text": "A perfectly placed runner, the coach signaling the sacrifice bunt from the dugout. The execution has to be perfect.", "labels": ["Execute the sacrifice bunt perfectly", "Ignore the sign and swing away"], "results": ["The ball rolls, soft and perfect, right where you placed it — a flawless sacrifice bunt!", "You ignore the sign and swing with everything you've got — coach be damned."]}, "es": {"title": "Situación de toque de sacrificio", "text": "Un corredor bien colocado, el entrenador señala el toque de sacrificio desde el banquillo. La ejecución debe ser perfecta.", "labels": ["Ejecutar el toque a la perfección", "Ignorar la señal y batear de lleno"], "results": ["La bola rueda, suave y perfecta, justo donde la colocaste — ¡toque de sacrificio impecable!", "Ignoras la señal y bateas con todas tus fuerzas — que el entrenador se enfade."]}}, "comeback_from_injury": {"en": {"title": "Comeback from injury", "text": "After time off, it's time to find your competitive rhythm again.", "labels": ["Ease back in gradually", "Push the pace to come back sooner"], "results": ["You handle your comeback with caution, step by step.", "You push the pace to get back on the field faster than planned."]}, "es": {"title": "Regreso tras una lesión", "text": "Tras un tiempo de baja, llega la hora de recuperar el ritmo competitivo.", "labels": ["Retomar progresivamente", "Forzar el ritmo para volver antes"], "results": ["Gestionas tu regreso con prudencia, paso a paso.", "Fuerzas el ritmo para volver al terreno antes de lo previsto."]}}, "batting_title_race": {"en": {"title": "Race for the batting title", "text": "Statisticians are buzzing: your name is climbing to the top of the batting average leaderboard. The title is within reach.", "labels": ["Refine your approach at the plate", "Stick with your usual routine"], "results": ["You fine-tune every detail of your approach, chasing every last point of average.", "You keep your routine intact, refusing to change a formula that already works."]}, "es": {"title": "Carrera por el título de bateo", "text": "Los estadísticos se emocionan: tu nombre escala a lo más alto de la tabla de promedios. El título está a tu alcance.", "labels": ["Afinar tu enfoque en el plato", "Mantener tu rutina habitual"], "results": ["Afinas cada detalle de tu enfoque, persiguiendo cada punto extra de promedio.", "Mantienes tu rutina intacta, sin cambiar una fórmula que ya funciona."]}}, "hr_chase": {"en": {"title": "Home run chase", "text": "Every home run you hit gets the crowd a little louder. Your name is entering the title race.", "labels": ["Swing for power every time", "Keep a balanced approach"], "results": ["You swing for the fences at every opportunity, sending the ball toward the stands!", "You keep a balanced approach rather than forcing every swing toward the stands."]}, "es": {"title": "Persecución del título de jonrones", "text": "Cada jonrón que conectas hace vibrar un poco más a la afición. Tu nombre entra en la carrera por el título.", "labels": ["Batear a por potencia siempre", "Mantener un enfoque equilibrado"], "results": ["Bateas a por todas en cada ocasión, ¡mandando la bola hacia las gradas!", "Mantienes un enfoque equilibrado en lugar de forzar cada swing hacia las gradas."]}}, "cy_young_race": {"en": {"title": "In the race for the best pitcher award", "text": "Your record is turning heads across the league. Scouts are already whispering your name for the best pitcher award.", "labels": ["Treat every start like a must-win", "Manage your pace over the long haul"], "results": ["You take the mound like every start is a must-win, refusing to give an inch.", "You manage your pace smartly rather than emptying the tank all at once."]}, "es": {"title": "En la carrera por el mejor lanzador", "text": "Tu récord llama la atención de toda la liga. Los observadores ya susurran tu nombre para el premio al mejor lanzador.", "labels": ["Tratar cada salida como una final", "Administrar tu ritmo a largo plazo"], "results": ["Subes al montículo como si cada salida fuera una final, sin ceder un centímetro.", "Administras tu ritmo con inteligencia en lugar de vaciar el depósito de golpe."]}}, "strikeout_chase": {"en": {"title": "Strikeout chase", "text": "Every strikeout makes the stadium roar a little louder. The league record is getting closer with every start.", "labels": ["Attack the zone on every pitch", "Favor efficiency over quick punchouts"], "results": ["You attack the zone on every pitch, hunting for the strikeout at all costs!", "You favor efficiency and quick outs over chasing your own personal record."]}, "es": {"title": "Persecución de ponches", "text": "Cada ponche hace rugir un poco más al estadio. El récord de la liga se acerca con cada salida.", "labels": ["Atacar la zona en cada lanzamiento", "Priorizar la eficacia sobre los ponches rápidos"], "results": ["Atacas la zona en cada lanzamiento, ¡buscando el ponche a toda costa!", "Priorizas la eficacia y los outs rápidos sobre la persecución de tu propio récord."]}}, "gold_glove_moment": {"en": {"title": "Defensive sequence that could matter", "text": "Another impossible catch, applauded by the entire stadium. The Gold Glove watchers are starting to take notice of your name.", "labels": ["Redouble your defensive focus", "Don't think about it, play as usual"], "results": ["You redouble your defensive focus, aware that every play could matter for the award.", "You just play your usual game, without thinking about the award that might follow."]}, "es": {"title": "Secuencia defensiva que puede pesar", "text": "Otra atrapada imposible, aplaudida por todo el estadio. Los observadores del Guante de Diamante empiezan a fijarse en tu nombre.", "labels": ["Redoblar el rigor defensivo", "No pensar en ello, jugar con normalidad"], "results": ["Redoblas el rigor defensivo, consciente de que cada jugada puede pesar para el premio.", "Simplemente juegas tu juego habitual, sin pensar en el premio que podría llegar."]}}, "superstitious_streak": {"en": {"title": "The superstitious reliever's quarantine", "text": "Since the win streak started, a teammate refuses to wash his uniform — and insists the whole team follow suit.", "labels": ["Play along, keep your \"lucky\" uniform", "Refuse, wash your uniform as usual"], "results": ["You play along with the superstition alongside the rest of the team, in an increasingly electric atmosphere.", "You refuse to give in to the superstition and wash your uniform like nothing's going on."]}, "es": {"title": "La cuarentena del relevista supersticioso", "text": "Desde que empezó la racha de victorias, un compañero se niega a lavar su uniforme — e insiste en que todo el equipo haga lo mismo.", "labels": ["Seguirle el juego, guardar tu uniforme \"de la suerte\"", "Negarte, lavar tu uniforme como siempre"], "results": ["Sigues el juego de la superstición junto al resto del equipo, en un ambiente cada vez más eléctrico.", "Te niegas a ceder ante la superstición y lavas tu uniforme como si nada."]}}, "secret_pitch_lesson": {"en": {"title": "The veteran's secret pitch", "text": "An old pitcher on the club claims to have mastered an unhittable pitch he's never shown anyone — and offers you an exclusive lesson.", "labels": ["Accept the lesson in secret", "Decline, stick to your own methods"], "results": ["You train in secret with the veteran, who shares his most obscure tricks with you.", "You politely decline, preferring to build your own repertoire of pitches."]}, "es": {"title": "El lanzamiento secreto del veterano", "text": "Un viejo lanzador del club asegura dominar una bola imposible de batear que nunca le ha enseñado a nadie — y te ofrece la exclusiva.", "labels": ["Aceptar la lección en secreto", "Rechazar, quedarte con tus propios métodos"], "results": ["Entrenas en secreto con el veterano, que te revela sus trucos más oscuros.", "Rechazas amablemente, prefiriendo construir tu propio repertorio de lanzamientos."]}}, "blackout_night_game": {"en": {"title": "Blackout mid-game", "text": "The stadium suddenly plunges into total darkness in the middle of a decisive night game. The lights go out, the crowd holds its breath in the dark.", "labels": ["Stay focused in the dark", "Use the break to catch your breath"], "results": ["You stay focused in the darkness, visualizing every move while waiting for the power to come back.", "You use this surreal break to catch your breath and recover some energy."]}, "es": {"title": "Apagón en pleno partido", "text": "El estadio se sume de repente en la oscuridad total en plena noche decisiva. Los focos se apagan, la afición contiene la respiración en la penumbra.", "labels": ["Mantener la concentración en la oscuridad", "Aprovechar la pausa para respirar"], "results": ["Te mantienes concentrado en la oscuridad, visualizando cada gesto mientras esperas que vuelva la luz.", "Aprovechas esta pausa surrealista para respirar y recuperar algo de energía."]}}, "cursed_tuesday": {"en": {"title": "The cursed calendar", "text": "The team hasn't won on a Tuesday in years — some teammates firmly believe it, and offer you a little good-luck ritual before the game.", "labels": ["Join the ritual, for fun or superstition", "Ignore the superstition, stay rational"], "results": ["You join the improvised ritual, somewhere between laughter and real superstition in the locker room.", "You ignore the superstition and approach Tuesday's game like any other day."]}, "es": {"title": "El calendario maldito", "text": "El equipo no gana un martes desde hace años — algunos compañeros lo creen a pies juntillas y te proponen un pequeño ritual de buena suerte antes del partido.", "labels": ["Participar en el ritual, por diversión o superstición", "Ignorar la superstición, mantenerte racional"], "results": ["Participas en el ritual improvisado, entre risas y verdadera superstición en el vestuario.", "Ignoras la superstición y afrontas el partido del martes como cualquier otro día."]}}, "mascot_incident": {"en": {"title": "The mascot steals the show", "text": "During warmups, the club mascot pulls off an improvised stunt that becomes a sensation — completely overshadowing the players on local social media.", "labels": ["Laugh it off and play along for the cameras", "Stay focused, ignore the commotion"], "results": ["You laugh heartily and play along for the cameras filming the scene.", "You stay focused on your preparation, leaving the mascot to collect the laughs alone."]}, "es": {"title": "La mascota se roba el show", "text": "Durante el calentamiento, la mascota del club protagoniza una improvisación que se vuelve viral — eclipsando por completo a los jugadores en las redes sociales locales.", "labels": ["Reírte y seguirle el juego ante las cámaras", "Mantenerte concentrado, ignorar el alboroto"], "results": ["Te ríes de buena gana y le sigues el juego ante las cámaras que grababan la escena.", "Te mantienes concentrado en tu preparación, dejando que la mascota se lleve las risas sola."]}}, "legendary_alumnus_return": {"en": {"title": "The return of a club legend", "text": "A former club great, back to quietly watch practice, walks up to you and shares advice she's never made public.", "labels": ["Listen closely and apply the advice", "Thank her politely, keep your own approach"], "results": ["You listen closely to every word and work hard to apply this rare advice from a legend.", "You politely thank the legend, but choose to stay true to your own approach."]}, "es": {"title": "El regreso de una leyenda del club", "text": "Una antigua gloria del club, de vuelta para ver el entrenamiento discretamente, se acerca a ti y te da un consejo que nunca ha compartido públicamente.", "labels": ["Escuchar con atención y aplicar el consejo", "Agradecer con cortesía, mantener tu propio enfoque"], "results": ["Escuchas con atención cada palabra y te esfuerzas por aplicar este consejo poco común de una leyenda.", "Agradeces cortésmente a la leyenda, pero decides mantenerte fiel a tu propio enfoque."]}}, "anthem_mishap": {"en": {"title": "The late national anthem", "text": "A protocol mishap delays the national anthem right before an important game — tension rises on the field as the ceremony drags on.", "labels": ["Stay calm and focused", "Let the irritation show"], "results": ["You stay calm despite the awkward delay, focused on what awaits you on the field.", "The irritation visibly sets in, and it doesn't escape the cameras present."]}, "es": {"title": "El himno cantado tarde", "text": "Un fallo de protocolo retrasa el himno nacional justo antes de un partido importante — la tensión crece en el terreno mientras la ceremonia se alarga.", "labels": ["Mantener la calma y la concentración", "Dejar que se note la irritación"], "results": ["Mantienes la calma pese al desajuste, concentrado en lo que te espera en el terreno.", "La irritación se nota visiblemente, y no escapa a las cámaras presentes."]}}, "hometown_parade": {"en": {"title": "Impromptu hometown parade", "text": "Back in your hometown, the locals throw together a surprise little parade in your honor.", "labels": ["Join in happily", "Stay low-key, thank them briefly"], "results": ["You play along happily, touched by this impromptu welcome.", "You stay low-key, thanking them briefly before returning to your peace and quiet."]}, "es": {"title": "Desfile improvisado en tu ciudad natal", "text": "De vuelta en tu ciudad natal, los vecinos organizan un pequeño desfile sorpresa en tu honor.", "labels": ["Participar con gusto", "Mantenerte discreto, agradecer brevemente"], "results": ["Te prestas al juego con gusto, conmovido por esta bienvenida improvisada.", "Te mantienes discreto, agradeciendo brevemente antes de volver a tu tranquilidad."]}}, "usa_holiday_game": {"en": {"title": "National holiday game", "text": "The stadium is decked out in the country's colors for the big holiday game, fireworks planned right after.", "labels": ["Feed off the festive mood", "Stick to your usual routine"], "results": ["You feed off the festive mood and play with an extra spark of energy.", "You stick to your usual routine, unfazed by the day's festivities."]}, "es": {"title": "Partido del día festivo nacional", "text": "El estadio está decorado con los colores del país para el gran partido festivo, con fuegos artificiales previstos después.", "labels": ["Alimentarte del ambiente festivo", "Mantener tu rutina habitual"], "results": ["Te alimentas del ambiente festivo y juegas con una energía extra.", "Mantienes tu rutina habitual, sin dejarte distraer por el folclore del día."]}}, "onsen_retreat": {"en": {"title": "Team onsen retreat", "text": "The team organizes a traditional trip to an onsen (hot spring) to bond before a heavy stretch of the season.", "labels": ["Fully embrace the tradition", "Keep it brief, save your energy"], "results": ["You fully embrace the tradition, Volver a casa para celebrar en familia", "Quedarte a entrenar"], "results": ["Vuelves a casa para celebrar el Chuseok en familia, recargado por ese momento compartido.", "Te quedas a entrenar mientras el resto del país celebra el Chuseok."]}}, "fan_chant_culture": {"en": {"title": "Improvised fan chants", "text": "The supporter groups have composed a chant just for you, sung in unison from the stands every time you step up to bat.", "labels": ["Acknowledge the fans, play along", "Stay focused, tune out the noise"], "results": ["You acknowledge the fans and play along with this unique piece of Korean baseball culture.", "You stay focused on the game, tuning out the chant sung in unison."]}, "es": {"title": "Cánticos improvisados de la afición", "text": "Los grupos de aficionados han compuesto un cántico solo para ti, coreado desde las gradas cada vez que sales a batear.", "labels": ["Saludar a la afición, seguirle el juego", "Mantenerte concentrado, ignorar el ruido"], "results": ["Saludas a la afición y le sigues el juego a esta tradición única del béisbol coreano.", "Te mantienes concentrado en el juego, sin dejarte distraer por el cántico coreado."]}}, "dia_de_muertos": {"en": {"title": "Day of the Dead tribute", "text": "The club is preparing a Day of the Dead tribute, dedicated to a late former player who left his mark on the club's history.", "labels": ["Get involved in the tribute", "Stay in the background, respectful but discreet"], "results": ["You get sincerely involved in the tribute, moved by this meaningful tradition.", "You stay in the background, respectful but discreet about this tradition intimate to the club."]}, "es": {"title": "Homenaje del Día de Muertos", "text": "El club prepara un homenaje por el Día de Muertos, dedicado a un antiguo jugador fallecido que marcó la historia del club.", "labels": ["Involucrarte en el homenaje", "Mantenerte al margen, respetuoso pero discreto"], "results": ["Te involucras sinceramente en el homenaje, conmovido por esta tradición tan significativa.", "Te mantienes al margen, respetuoso pero discreto ante esta tradición íntima para el club."]}}, "mariachi_serenade": {"en": {"title": "Mariachi serenade after the win", "text": "A mariachi band surprises the team with an impromptu serenade in the locker room after a big win.", "labels": ["Sing and dance along with the band", "Enjoy the moment from the sidelines"], "results": ["You sing and dance along with the mariachi band, in a full-on celebration atmosphere.", "You enjoy the moment from the sidelines, savoring the win your own way."]}, "es": {"title": "Serenata de mariachis tras la victoria", "text": "Un grupo de mariachis sorprende al equipo con una serenata improvisada en el vestuario tras una gran victoria.", "labels": ["Cantar y bailar con el grupo", "Disfrutar el momento desde un segundo plano"], "results": ["Cantas y bailas con el grupo de mariachis, en un ambiente de fiesta total.", "Disfrutas el momento desde un segundo plano, saboreando la victoria a tu manera."]}}, "unlucky_club_induction": {"en": {"title": "The Hard-Luck Fraternity", "text": "A small group of players going through a rough patch invites you to join their \"Hard-Luck Fraternity\" — an informal club dedicated to laughing at their own failures.", "labels": ["Join in, laugh about it together", "Decline, prefer to stay positive alone"], "results": ["You join the Hard-Luck Fraternity and have a good laugh about the rough patch with the other members.", "You politely decline, preferring to work through this rough patch your own way."]}, "es": {"title": "La Hermandad de la Mala Suerte", "text": "Un pequeño grupo de jugadores atravesando una mala racha te invita a unirte a su \"Hermandad de la Mala Suerte\" — un club informal dedicado a reírse de sus propios fracasos.", "labels": ["Unirte, reíros juntos", "Rechazar, preferir mantenerte positivo por tu cuenta"], "results": ["Te unes a la Hermandad de la Mala Suerte y os reís de buena gana de la mala racha junto a los demás miembros.", "Rechazas amablemente, prefiriendo superar esta mala racha a tu manera."]}}, "unlucky_club_ritual": {"en": {"title": "The Hard-Luck Fraternity's ritual", "text": "The Hard-Luck Fraternity holds its \"reverse jinx ritual\" — a deliberately absurd, deliberately botched moment meant to defuse pressure through humor.", "labels": ["Fully join the absurd ritual", "Watch with amusement, without joining in"], "results": ["You fully join the absurd ritual, and it feels great to release the pressure through laughter.", "You watch the scene with amusement, without daring to join in yourself."]}, "es": {"title": "El ritual de la Hermandad de la Mala Suerte", "text": "La Hermandad de la Mala Suerte celebra su \"ritual de la mala suerte invertida\" — un momento deliberadamente absurdo y fallido, pensado para liberar la presión a través del humor.", "labels": ["Participar plenamente en el ritual absurdo", "Observar con diversión, sin participar"], "results": ["Participas plenamente en el ritual absurdo, y sienta genial liberar la presión entre risas.", "Observas la escena con diversión, sin atreverte a participar tú mismo."]}}, "teammate_bonding": {"en": {"title": "Bonding moment with your teammate", "labels": ["Accept, strengthen the bond", "Decline, keep your distance"]}, "es": {"title": "Momento de complicidad con tu compañero", "labels": ["Aceptar, reforzar la complicidad", "Rechazar, mantener las distancias"]}}, "teammate_conflict": {"en": {"title": "Disagreement with your teammate", "labels": ["Seek to smooth things over", "Stand your ground"]}, "es": {"title": "Desacuerdo con tu compañero", "labels": ["Buscar calmar las cosas", "Mantenerte en tu postura"]}}, "teammate_celebration": {"en": {"title": "A win to celebrate together", "labels": ["Celebrate with the group", "Head home early, stay focused"]}, "es": {"title": "Una victoria para celebrar juntos", "labels": ["Celebrar con el grupo", "Volver pronto a casa, mantenerte concentrado"]}}, "teammate_favor": {"en": {"title": "A favor asked", "labels": ["Help out without hesitation", "Politely decline"]}, "es": {"title": "Un favor pedido", "labels": ["Ayudar sin dudarlo", "Rechazar amablemente"]}}, "post_win_interview": {"en": {"title": "Post-win interview", "labels": ["Stay humble, thank the team", "Show confidence, promise even better next year"]}, "es": {"title": "Entrevista tras la victoria", "labels": ["Mantenerte humilde, agradecer al equipo", "Mostrar confianza, prometer aún mejor el año que viene"]}}, "club_derby": {"en": {"title": "Derby against the club's big rival", "labels": ["Feed off the electric derby atmosphere", "Stay in your bubble, handle the pressure normally"]}, "es": {"title": "Derbi contra el gran rival del club", "labels": ["Alimentarte del ambiente eléctrico del derbi", "Mantenerte en tu burbuja, gestionar la presión con normalidad"]}}, "derby_week_media": {"en": {"title": "Derby week, media tension builds", "labels": ["Throw a friendly jab at the rival", "Stay diplomatic, avoid any controversy"]}, "es": {"title": "Semana de derbi, tensión mediática", "labels": ["Lanzar una pulla amistosa al rival", "Mantenerte diplomático, evitar la polémica"]}}, "winter_ball": {"en": {"title": "Winter league offer", "text": "A winter league abroad, known for forging young talent, offers you a spot for the off-season.", "labels": ["Accept, play the whole winter", "Decline, fully enjoy the rest"], "results": ["You accept and spend the whole winter playing, gaining rhythm but seriously wearing your body down.", "You decline to fully enjoy your winter break and let your body recover."]}, "es": {"title": "Oferta de liga de invierno", "text": "Una liga de invierno en el extranjero, conocida por forjar a los jóvenes talentos, te ofrece un lugar para la pretemporada.", "labels": ["Aceptar, jugar todo el invierno", "Rechazar, disfrutar plenamente del descanso"], "results": ["Aceptas y pasas todo el invierno jugando, ganando ritmo pero desgastando seriamente tu cuerpo.", "Rechazas para disfrutar plenamente de tu descanso invernal y dejar que tu cuerpo se recupere."]}}, "suicide_squeeze": {"en": {"title": "Suicide squeeze", "text": "Runner on third, a well-executed bunt scores the run — but a botched one leaves the runner dead to rights. The coach signals the suicide squeeze.", "labels": ["Execute the squeeze perfectly", "Refuse the risk, swing away instead"], "results": ["The bunt rolls exactly where you placed it, the run scores to a roaring stadium!", "You ignore the sign and swing away instead, preferring to leave nothing to chance."]}, "es": {"title": "Toque suicida", "text": "Corredor en tercera, un toque bien ejecutado anota la carrera — pero uno fallado deja al corredor sentenciado. El entrenador ordena el toque suicida.", "labels": ["Ejecutar el toque a la perfección", "Rechazar el riesgo, batear normal"], "results": ["La bola rueda justo donde la colocaste, la carrera anota entre el rugido del estadio!", "Ignoras la señal y bateas normal, prefiriendo no dejar nada al azar."]}}, "grand_slam_chance": {"en": {"title": "Grand slam chance", "text": "Bases loaded, two outs, and it's your turn to hit. One perfect swing can score four runs at once!", "labels": ["Swing for the fences for the grand slam", "Aim for simple contact to secure at least one run"], "results": ["You swing with everything you've got — the ball sails over the fence, grand slam!", "You aim for safe contact instead of the big swing, securing at least one run on the board."]}, "es": {"title": "Ocasión de jonrón con las bases llenas", "text": "Bases llenas, dos outs, y te toca batear. ¡Un swing perfecto puede anotar cuatro carreras de golpe!", "labels": ["Batear con todo a por el jonrón con bases llenas", "Buscar contacto simple para asegurar al menos una carrera"], "results": ["Bateas con todas tus fuerzas — ¡la bola vuela sobre la cerca, jonrón con las bases llenas!", "Buscas un contacto seguro en vez del batazo grande, asegurando al menos una carrera."]}}, "outfield_wall_crash": {"en": {"title": "Crash into the outfield wall", "text": "The ball is heading for the fence — one chance to catch it, at the cost of a head-on collision with the wall.", "labels": ["Charge the wall without hesitation", "Ease up to avoid the collision"], "results": ["You charge without hesitation, slam into the wall at full speed — but the ball stays in your glove!", "You ease up at the last moment to avoid the collision, letting the ball sail past the wall."]}, "es": {"title": "Choque contra la barda del jardín", "text": "La bola se dirige a la barda — una sola oportunidad de atraparla, al precio de un choque frontal contra el muro.", "labels": ["Lanzarte contra el muro sin dudar", "Frenar para evitar el choque"], "results": ["Te lanzas sin dudar, chocas de lleno contra el muro — ¡pero la bola se queda en tu guante!", "Frenas en el último momento para evitar el choque, dejando que la bola pase de largo."]}}, "check_swing_controversy": {"en": {"title": "Check-swing controversy", "text": "The umpire hesitates: did you really hold up your swing? The call hangs on his decision — and on your reaction.", "labels": ["Protest the call loudly", "Accept the call without complaint"], "results": ["You protest loudly, under the watchful eye of the head umpire.", "You accept the call without complaint, professional to the end."]}, "es": {"title": "Polémica por un medio swing", "text": "El árbitro duda: ¿realmente frenaste el swing? El resultado depende de su decisión — y de tu reacción.", "labels": ["Protestar enérgicamente la decisión", "Aceptar la decisión sin rechistar"], "results": ["Protestas enérgicamente, bajo la mirada atenta del árbitro principal.", "Aceptas la decisión sin rechistar, profesional hasta el final."]}}, "cycle_chase": {"en": {"title": "Chasing the cycle", "text": "Single, double, triple already in the bag this game — just a home run away from the rare hitting cycle.", "labels": ["Swing for the home run no matter what", "Play it simple, don't force it"], "results": ["You swing for the home run no matter what, aware of the feat within reach.", "You play it simple, refusing to force a swing that could ruin it all."]}, "es": {"title": "Persiguiendo el ciclo", "text": "Sencillo, doble y triple ya conseguidos en este partido — solo falta un jonrón para el rarísimo ciclo de bateo.", "labels": ["Batear a por el jonrón cueste lo que cueste", "Jugar simple, sin forzar el gesto"], "results": ["Bateas a por el jonrón cueste lo que cueste, consciente de la hazaña al alcance.", "Juegas simple, negándote a forzar un gesto que podría arruinarlo todo."]}}, "immaculate_inning": {"en": {"title": "Immaculate inning in sight", "text": "Nine pitches, three strikeouts in a row — the rare immaculate inning is within reach.", "labels": ["Attack the zone on every pitch", "Settle for routine outs"], "results": ["You attack the zone on every pitch, refusing to stray from the perfect plan.", "You settle for routine outs instead of chasing the feat."]}, "es": {"title": "Entrada inmaculada a la vista", "text": "Nueve lanzamientos, tres ponches seguidos — la rarísima entrada inmaculada está al alcance.", "labels": ["Atacar la zona en cada lanzamiento", "Conformarte con outs rutinarios"], "results": ["Atacas la zona en cada lanzamiento, negándote a desviarte del plan perfecto.", "Te conformas con outs rutinarios en lugar de perseguir la hazaña."]}}, "fan_interference": {"en": {"title": "Fan interference", "text": "A fan reaches over the fence and touches the ball in play — controversy erupts instantly.", "labels": ["Protest to the umpires", "Let it go, avoid the controversy"], "results": ["You protest to the umpires, demanding justice for the blatant interference.", "You let it go, refusing to fuel a pointless controversy."]}, "es": {"title": "Interferencia de un aficionado", "text": "Un aficionado extiende la mano sobre la valla y toca la bola en juego — la polémica estalla al instante.", "labels": ["Protestar ante los árbitros", "Dejarlo pasar, evitar la polémica"], "results": ["Protestas ante los árbitros, exigiendo justicia por la interferencia flagrante.", "Lo dejas pasar, negándote a alimentar una polémica inútil."]}}, "pinch_hit_moment": {"en": {"title": "Called on as pinch hitter", "text": "The coach calls you off the bench for a decisive at-bat, with zero warmup.", "labels": ["Charge in without thinking, trust your instinct", "Take a moment to prepare mentally"], "results": ["You charge to the plate without thinking, trusting your instinct completely.", "You take a moment to prepare mentally before facing the opposing pitcher."]}, "es": {"title": "Llamado como bateador emergente", "text": "El entrenador te llama desde la banca para un turno decisivo, sin calentamiento previo.", "labels": ["Ir sin pensarlo, confiar en tu instinto", "Tomarte un momento para prepararte mentalmente"], "results": ["Vas al plato sin pensarlo, confiando por completo en tu instinto.", "Te tomas un momento para prepararte mentalmente antes de enfrentar al lanzador rival."]}}, "complete_game_bid": {"en": {"title": "Chasing a complete game", "text": "Your arm is starting to feel heavy, but finishing this game start to finish without relief would be a real point of pride.", "labels": ["Push to finish the game", "Hand the ball to the bullpen out of caution"], "results": ["You push to finish what you started, even if it means digging into your very last reserves.", "You hand the ball to the bullpen out of caution, preferring to play the long game."]}, "es": {"title": "En busca del juego completo", "text": "Tu brazo empieza a pesar, pero terminar este partido de principio a fin sin relevo sería un verdadero orgullo.", "labels": ["Insistir en terminar el partido", "Ceder la bola al bullpen por precaución"], "results": ["Insistes en terminar lo que empezaste, aunque tengas que sacar fuerzas de donde no hay.", "Cedes la bola al bullpen por precaución, prefiriendo cuidarte a largo plazo."]}}, "triple_play_chance": {"en": {"title": "Triple play chance", "text": "A rare situation unfolds: three outs in one play are within reach, if the execution is flawless.", "labels": ["Go for the historic triple play", "Secure a classic double play instead"], "results": ["You go for the historic play — and the triple play wraps up to a standing ovation!", "You secure a classic double play instead, rather than risking the feat."]}, "es": {"title": "Ocasión de triple play", "text": "Se presenta una situación rarísima: tres outs de una sola jugada están al alcance, si la ejecución es perfecta.", "labels": ["Ir a por el histórico triple play", "Asegurar un doble play clásico"], "results": ["Vas a por la jugada histórica — ¡y el triple play se cierra entre una ovación de pie!", "Aseguras un doble play clásico en vez de arriesgar la hazaña."]}}};

}

function achText(frLabel) { return STATE.lang === "fr" ? null : ((ACHIEVEMENT_I18N[STATE.lang] || {})[frLabel] || null); }
function dailyText(frLabel) { return STATE.lang === "fr" ? frLabel : ((DAILY_I18N[STATE.lang] || {})[frLabel] || frLabel); }

function translateTrophyString(t) {
  if (STATE.lang === "fr") return t;
  const m = t.match(/^(.*?)(\s*\((.*)\))?$/);
  const base = (m[1] || t).trim();
  const inner = m[3];
  const translatedBase = awardName(base);
  if (!inner) return translatedBase;
  const translatedInner = inner.replace(/(\d+)e saison/, (_, n) => STATE.lang === "en" ? `Season ${n}` : `Temporada ${n}`);
  return `${translatedBase} (${translatedInner})`;
}

function localizeEvent(ev, teamName) {
  if (STATE.lang === "fr") return ev;
  const tr = EVENT_I18N[ev.id] && EVENT_I18N[ev.id][STATE.lang];
  if (!tr) return ev;
  let rawText = ev.text;
  if (ev.weather && ev.weather.fr && rawText.indexOf(ev.weather.fr) === 0) {
    const withoutPrefix = rawText.slice(ev.weather.fr.length);
    rawText = withoutPrefix.charAt(0).toUpperCase() + withoutPrefix.slice(1);
  }
  let text = tr.text ? (tr.text.indexOf("{team}") !== -1 ? tr.text.replace("{team}", teamName) : tr.text) : (translateDynamicText(rawText) || rawText);
  if (ev.weather && ev.weather[STATE.lang]) {
    text = ev.weather[STATE.lang] + text.charAt(0).toLowerCase() + text.slice(1);
  }
  const boldTr = BOLD_CHOICE_I18N[STATE.lang];
  return Object.assign({}, ev, {
    title: tr.title,
    text,
    choices: ev.choices.map((c, i) => {
      if (i >= 2) return Object.assign({}, c, { label: boldTr.label, result: boldTr.result });
      return Object.assign({}, c, {
        label: (tr.labels && tr.labels[i]) || c.label,
        result: (tr.results && tr.results[i]) || translateDynamicText(c.result) || null,
      });
    }),
  });
}

function translateLogEntry(entry) {
  if (STATE.lang === "fr") return entry;
  const prefixMatch = entry.match(/^\[(\d+) ans\]\s*(.*)$/s);
  const ageUnit = STATE.lang === "en" ? "yo" : "años";
  if (!prefixMatch) return entry;
  const age = prefixMatch[1];
  const rest = prefixMatch[2];
  for (const pat of LOG_PATTERNS) {
    const m = rest.match(pat.re);
    if (m) {
      const translated = STATE.lang === "en" ? pat.en(m) : pat.es(m);
      return `[${age} ${ageUnit}] ${translated}`;
    }
  }
  return `[${age} ${ageUnit}] ${rest}`;
}

function localizeEntryChoice(choice) {
  if (STATE.lang === "fr") return choice;
  const tr = ENTRY_I18N[choice.label] && ENTRY_I18N[choice.label][STATE.lang];
  if (!tr) return choice;
  return Object.assign({}, choice, { label: tr.label, description: tr.description, result: tr.result || null });
}

// ---------- Courbe de progression (score de carrière saison par saison) ----------

function progressionChartSvg(seasonHistory) {
  const w = 300, h = 90, pad = 6;
  const pts = seasonHistory.map(s => s.points);
  const maxPoints = Math.max(1, ...pts);
  const minPoints = Math.min(0, ...pts);
  const range = Math.max(1, maxPoints - minPoints);
  const stepX = seasonHistory.length > 1 ? (w - pad * 2) / (seasonHistory.length - 1) : 0;
  const coords = seasonHistory.map((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((s.points - minPoints) / range) * (h - pad * 2);
    return [x, y];
  });
  const pointsAttr = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const areaAttr = `${pad},${(h - pad).toFixed(1)} ${pointsAttr} ${(w - pad).toFixed(1)},${(h - pad).toFixed(1)}`;
  const dots = coords.map(([x, y], i) =>
    `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i === coords.length - 1 ? 3 : 1.5}" class="progression-dot"/>`
  ).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="progression-chart" role="img" aria-label="${T("progressionTitle")}">
    <polygon points="${areaAttr}" class="progression-area"/>
    <polyline points="${pointsAttr}" class="progression-line"/>
    ${dots}
  </svg>`;
}

// ---------- Stockage persistant (récompenses + historique des carrières) ----------
// Essaie d'abord l'API window.storage (aperçu d'artifact Claude), puis localStorage
// (fichier ouvert directement dans un navigateur), puis un repli en mémoire.

const _memoryStore = {};

const Store = {
  async get(key) {
    try {
      if (typeof window !== "undefined" && window.storage) {
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
    } catch (e) { /* API indisponible ou clé absente : on tente le repli */ }
    try {
      const v = localStorage.getItem("diamond-destiny:" + key);
      if (v !== null) return v;
    } catch (e) { /* localStorage indisponible (ex: aperçu sandboxé) */ }
    return Object.prototype.hasOwnProperty.call(_memoryStore, key) ? _memoryStore[key] : null;
  },
  async set(key, value) {
    _memoryStore[key] = value;
    try {
      if (typeof window !== "undefined" && window.storage) {
        await window.storage.set(key, value, false);
        return true;
      }
    } catch (e) { /* API indisponible : on tente le repli */ }
    try {
      localStorage.setItem("diamond-destiny:" + key, value);
    } catch (e) { /* pas grave, la partie en mémoire suffit pour cette session */ }
    return true;
  },
};

const SAVE_SLOTS = [1, 2, 3];

async function saveToSlot(slot, player) {
  try { await Store.set("save-slot-" + slot, JSON.stringify(player)); } catch (e) { /* best effort */ }
}
async function loadFromSlot(slot) {
  try {
    const raw = await Store.get("save-slot-" + slot);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
async function clearSlot(slot) {
  try { await Store.set("save-slot-" + slot, ""); } catch (e) { /* best effort */ }

async function loadAllSlots() {
  const results = await Promise.all(SAVE_SLOTS.map(s => loadFromSlot(s)));
  return SAVE_SLOTS.map((s, i) => ({ slot: s, player: results[i] }));
}
